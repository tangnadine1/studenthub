/* ---------- Read aloud ---------- */
var SYN=window.speechSynthesis,speaking=null;
if(!SYN||typeof SpeechSynthesisUtterance==="undefined")document.documentElement.classList.add("nospeech");
var ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function spoken(t){var es=LANG==="es",BL=tx("blank");return t.replace(/(\d)\s*:\s*(\d)/g,"$1 "+tx("to")+" $2").replace(/×/g,es?" por ":" times ").replace(/÷/g,es?" entre ":" divided by ").replace(/−/g,es?" menos ":" minus ").replace(/⅛/g,es?" un octavo ":" one eighth ").replace(/=/g,es?" igual a ":" equals ").replace(/\u2713|\u25CF/g,"").replace(new RegExp(BL+"\\s*:\\s*"+BL,"g"),BL+" "+tx("to")+" "+BL).replace(/\s+/g," ").trim()}
function textOf(el){var c=el.cloneNode(true);
  $$("#mk",c).forEach(function(n){n.remove()});
  $$(".lis,.fb,button.b,.tiles .tile",c).forEach(function(n){if(!n.closest("[data-say]")||n.classList.contains("lis")||n.classList.contains("fb"))n.remove()});
  $$("[data-say]",c).forEach(function(n){n.replaceWith(document.createTextNode(" "+n.getAttribute("data-say")+" "))});
  $$("input[type=text],select",c).forEach(function(n){n.replaceWith(document.createTextNode(" "+tx("blank")+" "))});
  $$("input[type=checkbox],input[type=radio]",c).forEach(function(n){n.remove()});
  $$("p,li,h4,.opt,.sentence,.hintbox,tr",c).forEach(function(n){n.appendChild(document.createTextNode(". "))});
  return spoken(c.textContent).replace(/\.\s*\./g,".").replace(/([?!])\./g,"$1").replace(/:\s*\./g,":")}
function stopSpeech(){if(SYN)SYN.cancel();if(speaking){speaking.classList.remove("on");speaking.innerHTML=ICON+tx("Listen");speaking=null}}
function speak(btn,el){if(!SYN)return;var was=speaking===btn;stopSpeech();if(was)return;
  var parts=textOf(el).split(/(?<=[.?!])\s+/).filter(function(x){return x.trim()});if(!parts.length)return;
  speaking=btn;btn.classList.add("on");btn.innerHTML=ICON+tx("Stop");
  var rate=parseFloat($("#spd").value)||0.95,v=(SYN.getVoices()||[]).filter(function(x){return new RegExp("^"+LANG,"i").test(x.lang)});
  var voice=v.filter(function(x){return (LANG==="es"?/es[-_](US|MX)/i:/en[-_]US/i).test(x.lang)})[0]||v[0];
  parts.forEach(function(t,i){var u=new SpeechSynthesisUtterance(t);u.rate=rate;u.lang=LANG==="es"?"es-US":"en-US";if(voice)u.voice=voice;
    if(i===parts.length-1){u.onend=u.onerror=function(){if(speaking===btn){btn.classList.remove("on");btn.innerHTML=ICON+tx("Listen");speaking=null}}}
    SYN.speak(u)})}
function ensureListen(){$$(".say,.fb.show,.how,.twin,.hintbox").forEach(function(el){if(el.querySelector(":scope > .lis"))return;
  el.insertAdjacentHTML("afterbegin",'<button type="button" class="lis" aria-label="'+tx("Read this aloud")+'">'+ICON+tx("Listen")+'</button>')})}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".lis");if(b)speak(b,b.parentElement)});
new MutationObserver(ensureListen).observe($("#main"),{childList:true,subtree:true});
try{var sp=localStorage.getItem("ratioCoachSpeed");if(sp)$("#spd").value=sp}catch(e){}
$("#spd").addEventListener("change",function(){try{localStorage.setItem("ratioCoachSpeed",$("#spd").value)}catch(e){}stopSpeech()});
var cur=0,hintsShown=[],tried=[],main=$("#main"),chips=$("#chips");
/* ---------- Tracking (name, progress, active time) ---------- */
var T={id:null,db:null,teacher:false,mode:"checking",lastInput:0,timeDirty:false,busy:false,again:false,unsub:null};
function iso(){return new Date().toISOString()}
function docData(){var q={},tot=0,n=0;Q.forEach(function(x,i){var s=st(i);tot+=s.sec||0;if(s.done)n++;q[i+1]={done:!!s.done,help:!!s.help,tries:s.tries||0,hints:s.hints||0,sec:s.sec||0}});
  return {name:store.name,startedAt:store.startedAt||iso(),updatedAt:iso(),activeSec:tot,doneCount:n,lang:LANG,q:q}}
function paintWho(){var w=$("#who");if(!store.name){w.textContent="";return}
  var m={on:tx("Your progress is being saved for your teacher."),off:tx("Your teacher can't see your progress from this device. Use the Copy my results button on your results page when you finish."),checking:tx("Checking whether your progress can be saved for your teacher...")};
  w.innerHTML=tx("Working as")+" <b>"+esc(store.name)+'</b> &middot; <button type="button" class="link" id="chg">'+tx("Change name")+'</button><br>'+(T.teacher?tx("You are signed in as the teacher."):m[T.mode])}
function flush(){if(!T.db||!T.id||!store.name)return;if(T.busy){T.again=true;return}T.busy=true;T.timeDirty=false;save();
  T.db.doc("results/"+T.id).set(docData()).then(function(){T.mode="on"},function(){T.mode="off"}).then(function(){T.busy=false;paintWho();if(T.again){T.again=false;flush()}})}
function note(){T.lastInput=Date.now();flush()}
["pointerdown","keydown","input","touchstart"].forEach(function(ev){document.addEventListener(ev,function(){T.lastInput=Date.now()},true)});
setInterval(function(){if(document.visibilityState!=="visible"||typeof cur!=="number"||!store.name||Date.now()-T.lastInput>60000)return;
  var o=store["q"+cur]=store["q"+cur]||{};o.sec=(o.sec||0)+1;T.timeDirty=true},1000);
setInterval(function(){if(T.timeDirty)flush()},60000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&T.timeDirty)flush()});
window.addEventListener("pagehide",function(){if(T.timeDirty)flush()});
function nameGate(){main.innerHTML='<section class="card"><div class="kicker"><span class="tag">'+tx("Welcome")+'</span></div><h3 class="q">'+tx("Type your name to begin")+'</h3><p>'+tx("Your teacher can see your name, which questions you finish, how many hints you use, and how long you work.")+'</p><form id="nf" class="sentence"><label for="nm">'+tx("First and last name")+'</label><input type="text" id="nm" autocomplete="name" maxlength="60" value="'+esc(store.name||"")+'" style="width:min(18em,100%);text-align:left"><button class="b main" type="submit">'+tx("Start")+'</button></form><p class="sub" id="ne" role="alert"></p>'+(T.teacher?'<div class="btns"><button type="button" class="b" id="tv">I am the teacher, show results</button></div>':'')+'</section>';
  $("#nf").onsubmit=function(e){e.preventDefault();var v=$("#nm").value.replace(/\s+/g," ").trim();if(v.length<2){$("#ne").textContent=tx("Please type your first and last name.");return}
    store.name=v;if(!store.startedAt)store.startedAt=iso();save();paintWho();flush();var f=0;for(var z=0;z<Q.length;z++){if(!st(z).done){f=z;break}}go(f)};
  if($("#tv"))$("#tv").onclick=function(){go("teacher")};drawChips()}
function mmss(s){s=s||0;return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function teacherView(){main.innerHTML='<section class="card"><div class="kicker"><span class="tag">Teacher results</span></div><h3 class="q">Student progress</h3><p class="sub">Updates live. Time counts only while the page is open and the student is active. &#10003; finished on their own, &#9679; finished with hints or a solution, &hellip; tried but not finished.</p><div class="scroll" id="tr">Loading...</div></section>';
  if(T.unsub){T.unsub();T.unsub=null}
  if(!T.db){$("#tr").textContent="Results are not available in this view. Open the page while signed in as the owner.";return}
  T.unsub=T.db.collection("results").onSnapshot(function(snap){var rows=snap.docs.map(function(d){return d.data()}).filter(Boolean).sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
    if(!rows.length){$("#tr").innerHTML="<p>No students yet. A student appears here after they type their name and open the page while signed in.</p>";return}
    var h='<table class="tbl tt"><tr><th>Name</th><th>Done</th><th>On own</th><th>Hints</th><th>Time</th><th>Last active</th>'+Q.map(function(x,i){return "<th>"+(i+1)+"</th>"}).join("")+"</tr>";
    rows.forEach(function(r){var q=r.q||{},own=0,hs=0;Q.forEach(function(x,i){var c=q[i+1]||{};if(c.done&&!c.help)own++;hs+=c.hints||0});
      var when=r.updatedAt?new Date(r.updatedAt).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
      h+='<tr><td class="nm">'+esc(r.name||"(no name)")+"</td><td>"+(r.doneCount||0)+"/10</td><td>"+own+"</td><td>"+hs+"</td><td>"+mmss(r.activeSec)+"</td><td>"+esc(when)+"</td>"+
      Q.map(function(x,i){var c=q[i+1]||{},sym=c.done?(c.help?"&#9679;":"&#10003;"):(c.tries?"&hellip;":"&ndash;");return '<td title="Q'+(i+1)+": "+(c.tries||0)+" tries, "+(c.hints||0)+" hints, "+mmss(c.sec)+'">'+sym+"</td>"}).join("")+"</tr>"});
    $("#tr").innerHTML=h+"</table>"},function(){$("#tr").textContent="Could not load results."})}
$("#who").addEventListener("click",function(e){if(e.target.id==="chg")nameGate()});
function st(i){return store["q"+i]||{}}
function setSt(i,o){store["q"+i]=Object.assign(st(i),o);save()}
function drawChips(){chips.innerHTML=Q.map(function(q,i){var s=st(i),cl=s.done?(s.help?"help":"done"):"",mark=s.done?(s.help?"●":"✓"):"";
  return '<button type="button" class="chip '+cl+'" data-i="'+i+'"'+(i===cur?' aria-current="true"':'')+'><b>'+(i+1)+'</b><small>'+esc(tx(q.short))+'</small><span class="st" aria-label="'+tx(s.done?(s.help?"finished with help":"correct"):"not finished")+'">'+mark+'</span></button>'}).join("")+
  '<button type="button" class="chip" data-i="end"'+(cur==="end"?' aria-current="true"':'')+'><b>★</b><small>'+tx("My results")+'</small></button>'+(T.teacher?'<button type="button" class="chip" data-i="teacher"'+(cur==="teacher"?' aria-current="true"':'')+'><b>T</b><small>Teacher results</small></button>':'');
  var n=Q.filter(function(q,i){return st(i).done}).length;$("#pbar").style.width=(n*10)+"%"}
chips.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;if(!store.name&&b.dataset.i!=="teacher")return;go(b.dataset.i==="end"||b.dataset.i==="teacher"?b.dataset.i:+b.dataset.i)});
function go(i){stopSpeech();cur=i;if(T.unsub&&i!=="teacher"){T.unsub();T.unsub=null}if(typeof i==="number")hintsShown[i]=hintsShown[i]||0;i==="end"?end():i==="teacher"?teacherView():show(i);drawChips();window.scrollTo(0,0);if(typeof i==="number"||i==="end")note()}

function show(i){var q=Q[i],s=st(i);
  main.innerHTML='<section class="card" id="card"><div class="kicker"><span class="tag">'+esc(tx("Question {0} of 10").replace("{0}",i+1))+'</span><span class="tag2">'+esc(tx(q.skill))+'</span></div><h3 class="q">'+esc(tx(q.short))+'</h3><div class="say"><div class="prompt">'+tx(q.prompt)+'</div><div class="work" id="work">'+q.body()+'</div></div>'+
  '<div class="btns"><button type="button" class="b main" id="chk">'+tx("Check my answer")+'</button><button type="button" class="b" id="hnt">'+tx("Give me a hint")+'</button><button type="button" class="b" id="how" disabled>'+tx("Show me how")+'</button></div>'+
  '<div class="fb" id="fb" role="status" aria-live="polite"></div><div class="hints" id="hints"></div><div id="howbox"></div><div id="after"></div></section>';
  var r=$("#work");if(q.bind)q.bind(r);
  tried[i]=tried[i]||0;hintsShown[i]=hintsShown[i]||0;
  for(var k=0;k<hintsShown[i];k++)addHint(i,k);
  gate(i);
  $("#chk").onclick=function(){var res=q.check(r),fb=$("#fb");
    if(res.empty){fb.className="fb show info";fb.innerHTML="<strong>"+tx("Almost ready.")+"</strong><p>"+tx("Fill in or choose every answer first, then check.")+"</p>";return}
    tried[i]++;setSt(i,{tries:(st(i).tries||0)+1});
    if(res.ok){var h=hintsShown[i]>0||st(i).help;setSt(i,{done:true,help:!!(h)});fb.className="fb show ok";fb.innerHTML="<strong>"+tx("That's right!")+"</strong><p>"+tx(h?"Nice work sticking with it. Try the similar problem to lock it in.":"You got it on your own. Try the similar problem if you want a challenge.")+"</p>";drawChips();after(i)}
    else{fb.className="fb show no";fb.innerHTML="<strong>"+tx("Not quite yet.")+"</strong><p>"+res.msg+"</p>"}
    gate(i);note()};
  $("#hnt").onclick=function(){if(hintsShown[i]<3){addHint(i,hintsShown[i]);hintsShown[i]++;setSt(i,{hints:Math.max(st(i).hints||0,hintsShown[i])});gate(i);note()}};
  $("#how").onclick=function(){showHow(i)};
  if(s.done)after(i);
}
function addHint(i,k){var d=document.createElement("div");d.className="hintbox";d.innerHTML="<b>"+tx("Hint {0} of 3:").replace("{0}",k+1)+"</b> "+tx(Q[i].hints[k]);$("#hints").appendChild(d)}
function gate(i){var h=$("#hnt"),w=$("#how");h.textContent=hintsShown[i]>=3?tx("No more hints"):(hintsShown[i]?tx("Another hint ({0}/3)").replace("{0}",hintsShown[i]):tx("Give me a hint"));h.disabled=hintsShown[i]>=3;
  w.disabled=!(tried[i]>=2||hintsShown[i]>=2||st(i).done);w.title=w.disabled?tx("Try it or use two hints first"):""}
function showHow(i){var q=Q[i];setSt(i,{help:true});$("#howbox").innerHTML='<div class="how"><h4>'+tx("Worked solution")+'</h4><ol>'+q.how.map(function(x){return "<li>"+tx(x)+"</li>"}).join("")+'</ol></div>';
  if(!st(i).done)$("#fb").className="fb";after(i,true);drawChips();note()}
function after(i,fromHow){var q=Q[i],a=$("#after"),done=st(i).done;
  var nxt=i<Q.length-1?'<button type="button" class="b main" id="nx">'+tx("Next question")+'</button>':'<button type="button" class="b main" id="nx">'+tx("See my results")+'</button>';
  a.innerHTML='<div class="twin"><h4>'+tx("Try a similar one")+'</h4><p>'+esc(tx(q.twin.p))+'</p><div class="sentence">'+q.twin.f.map(function(f,k){return '<label>'+esc(tx(f[0]))+': '+numField("tw"+k,tx(f[0]))+'</label>'}).join(" ")+'</div><div class="btns" style="margin-top:8px"><button type="button" class="b" id="twc">'+tx("Check")+'</button>'+nxt+'</div><div class="fb" id="twfb" role="status" aria-live="polite"></div></div>';
  $("#nx").onclick=function(){go(i<Q.length-1?i+1:"end")};
  $("#twc").onclick=function(){var v=q.twin.f.map(function(f,k){return num($("#tw"+k).value)}),fb=$("#twfb");
    if(v.some(isNaN)){fb.className="fb show info";fb.innerHTML="<strong>"+tx("Fill in every box first.")+"</strong>";return}
    var good=q.twin.f.every(function(f,k){return same(v[k],num(f[1]))});
    fb.className="fb show "+(good?"ok":"no");fb.innerHTML=good?"<strong>"+tx("Yes! Same idea, new numbers.")+"</strong><p>"+tx(q.twin.ex)+"</p>":"<strong>"+tx("Close, but not yet.")+"</strong><p>"+tx("Use the same steps you used above. Try again.")+"</p>"}}
function end(){var n=Q.filter(function(q,i){return st(i).done&&!st(i).help}).length,d=Q.filter(function(q,i){return st(i).done}).length;
  var rev=Q.map(function(q,i){return !st(i).done||st(i).help?tx(q.skill):null}).filter(Boolean);
  main.innerHTML='<section class="card"><div class="kicker"><span class="tag">'+tx("My results")+'</span></div><p class="sub">'+esc(store.name||"")+'</p><h3 class="q">'+(d===10?tx("You finished all 10!"):tx("{0} of 10 finished").replace("{0}",d))+'</h3><p>'+tx("{0} on your own, {1} with hints or a worked solution.").replace("{0}",n).replace("{1}",d-n)+'</p><div class="sum">'+
  Q.map(function(q,i){var s=st(i);return '<div><b>'+(i+1)+'</b><span style="flex:1;min-width:8em">'+esc(tx(q.short))+'</span><span>'+tx(s.done?(s.help?"Finished with help":"On my own"):"Not finished")+'</span></div>'}).join("")+'</div>'+
  (rev.length?'<p style="margin-top:14px"><b>'+tx("Review these ideas before the test:")+'</b> '+rev.map(esc).join("; ")+'.</p>':'<p style="margin-top:14px"><b>'+tx("Nice work.")+'</b> '+tx("Try the similar problems to keep your skills sharp.")+'</p>')+
  '<div class="twin" style="border-color:var(--accent)"><h4>'+tx("Send my results to my teacher")+'</h4><p>'+tx("Press the button, then paste this into the form or assignment your teacher gives you.")+'</p><textarea id="rtxt" readonly rows="3" style="width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px"></textarea><div class="btns" style="margin-top:8px"><button type="button" class="b main" id="cp">'+tx("Copy my results")+'</button><span id="cpm" role="status" aria-live="polite"></span></div></div>'+
  '<div class="btns"><button type="button" class="b" id="rs">'+tx("Start over")+'</button></div></section>';
  var tot=0,hs=0,codes=Q.map(function(x,i){var c=st(i);tot+=c.sec||0;hs+=c.hints||0;return (i+1)+(c.done?(c.help?"H":"O"):"-")}).join(" ");
  $("#rtxt").value=(store.name||"")+" | "+d+"/10 done | "+n+" on own | "+hs+" hints | "+Math.round(tot/60)+" min | "+codes+" (O=own, H=help, -=not done)";
  $("#cp").onclick=function(){var ta=$("#rtxt"),ok=function(){$("#cpm").textContent=tx("Copied!")},no=function(){ta.focus();ta.select();$("#cpm").textContent=tx("Select the text and copy it.")};
    try{navigator.clipboard.writeText(ta.value).then(ok,no)}catch(e){no()}};
  $("#rs").onclick=function(){store={name:store.name,startedAt:iso()};save();hintsShown=[];tried=[];go(0)}}
$("#theme").onclick=function(){var el=document.documentElement,dark=el.getAttribute("data-theme")==="dark"||(!el.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);el.setAttribute("data-theme",dark?"light":"dark")};
function applyLang(){document.documentElement.lang=LANG;$("#lng").value=LANG;
  $("#h1").textContent=tx("Ratio Coach");$("#subt").textContent=tx("Grade 6, Module 1 mid-module practice. Try it first, use hints when you need them.");$("#railh").textContent=tx("Your questions");
  $("#theme").textContent=tx("Switch light / dark");$("#lngl").textContent=tx("Language");$("#spdl").textContent=tx("Reading speed");$("#o1").textContent=tx("Slow");$("#o2").textContent=tx("Normal");
  document.title=tx("Ratio Coach");paintWho()}
$("#lng").addEventListener("change",function(){stopSpeech();LANG=$("#lng").value;try{localStorage.setItem("ratioCoachLang",LANG)}catch(e){}applyLang();if(!store.name)nameGate();else go(cur==="teacher"?"teacher":cur);if(store.name)flush()});
var first=0;for(var z=0;z<Q.length;z++){if(!st(z).done){first=z;break}if(z===Q.length-1)first=0}
applyLang();
if(!store.name){drawChips();nameGate()}else go(first);
(async function(){try{if(window.claude&&claude.use){var u=await claude.use("user");if(u){T.teacher=!!(await u.canEdit());T.id=await u.id()}T.db=await claude.use("db")}}catch(e){}
  T.mode=(T.db&&T.id)?"on":"off";paintWho();drawChips();if(!store.name){if(T.teacher)nameGate()}else if(T.db&&T.id)flush()})();
})();
</script>

</body></html>
