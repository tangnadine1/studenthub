<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ratio Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: sticky progress rail (top bar on phones) + one question card at a time, with hints, check, worked solution, and a twin problem. */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#14213D; --muted:#53607C; --line:#D5DDEB;
  --accent:#2B50D8; --accent-ink:#FFFFFF; --warm:#F08A24; --warm-soft:#FDEBD6;
  --ok:#17784A; --ok-soft:#DDF3E7; --bad:#B3302F; --bad-soft:#FBE3E1; --hint:#7A4B00; --hint-soft:#FFF1C9;
  --soft:#E4EAF8; --circle:#3F8FD8; --square:#1B2233; --tri:#3C6B2A;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172039; --ink:#E9EEFB; --muted:#A3AFCB; --line:#2B3858;
  --accent:#7C9BFF; --accent-ink:#0E1424; --warm:#F5A04D; --warm-soft:#3A2A14;
  --ok:#5BD28F; --ok-soft:#14382A; --bad:#FF8F8B; --bad-soft:#3E1D1F; --hint:#FFD36E; --hint-soft:#3A3010;
  --soft:#222E50; --circle:#5FAAF0; --square:#E9EEFB; --tri:#7FC45E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172039; --ink:#E9EEFB; --muted:#A3AFCB; --line:#2B3858;
  --accent:#7C9BFF; --accent-ink:#0E1424; --warm:#F5A04D; --warm-soft:#3A2A14;
  --ok:#5BD28F; --ok-soft:#14382A; --bad:#FF8F8B; --bad-soft:#3E1D1F; --hint:#FFD36E; --hint-soft:#3A3010;
  --soft:#222E50; --circle:#5FAAF0; --square:#E9EEFB; --tri:#7FC45E; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:18px 48px}
*{box-sizing:border-box}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
header.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.rail{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:6px;padding-top:4px}
.rail h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.chip{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:.95rem;cursor:pointer;text-align:left}
.chip b{font-family:var(--display);width:1.6em;text-align:center}
.chip small{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chip.done{background:var(--ok-soft);border-color:var(--ok)}
.chip.help{background:var(--warm-soft);border-color:var(--warm)}
.chip .st{font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.tag2{font-size:.8rem;background:var(--soft);padding:2px 10px;border-radius:99px;color:var(--muted)}
h3.q{font-family:var(--display);font-size:1.35rem;line-height:1.3;margin:0 0 14px;text-wrap:balance;font-weight:600}
.prompt p{margin:0 0 10px;max-width:68ch}
.prompt{margin-bottom:14px}
.work{border-top:1px dashed var(--line);padding-top:16px;margin-top:6px}
input[type=text],select{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:6px 10px;min-height:44px}
input[type=text]{width:6.5em;text-align:center;font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible,.opt:focus-within,.shape:focus-visible,.slot:focus-visible,.tile:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:8px 0}
.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button.b{font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;min-height:46px;cursor:pointer;border:2px solid var(--accent);background:var(--surface);color:var(--accent)}
button.b.main{background:var(--accent);color:var(--accent-ink)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.fb.info{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.fb strong{display:block;font-family:var(--display);font-size:1.05rem}
.fb p{margin:4px 0 0;color:var(--ink)}
.hints{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.hintbox{background:var(--hint-soft);color:var(--ink);border-left:6px solid var(--warm);border-radius:8px;padding:10px 14px}
.hintbox b{color:var(--hint)}
.how{margin-top:16px;border:2px solid var(--accent);border-radius:12px;padding:14px 18px;background:var(--surface)}
.how h4{margin:0 0 6px;font-family:var(--display);font-size:1.1rem}
.how ol{margin:6px 0 0;padding-left:1.3em}.how li{margin:5px 0;max-width:68ch}
.twin{margin-top:18px;border:2px dashed var(--warm);border-radius:12px;padding:14px 18px}
.twin h4{margin:0 0 6px;font-family:var(--display)}
.mathy{font-variant-numeric:tabular-nums;font-weight:700}
.shapes{display:grid;grid-template-columns:repeat(6,minmax(0,52px));gap:10px;margin:8px 0 12px;padding:14px;background:var(--bg);border-radius:12px;width:fit-content;max-width:100%}
.shape{width:100%;aspect-ratio:1;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;cursor:pointer;padding:0}
.shape i{display:block;width:70%;aspect-ratio:1}
.shape.c i{background:var(--circle);border-radius:50%}.shape.s i{background:var(--square)}
.shape.t i{background:var(--tri);clip-path:polygon(50% 0,100% 100%,0 100%)}
.shape.m{box-shadow:0 0 0 3px var(--warm) inset;background:var(--warm-soft)}
.tbl{border-collapse:collapse;margin:8px 0}.tbl th,.tbl td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.tbl th{background:var(--soft);font-weight:700}
.scroll{overflow-x:auto;max-width:100%}
.nl{display:grid;grid-template-columns:auto repeat(5,minmax(64px,1fr));gap:0;align-items:center;margin:10px 0;min-width:430px}
.nl .lab{font-weight:700;padding-right:10px}
.nl .cell{text-align:center;padding:8px 0;position:relative;font-weight:700;font-variant-numeric:tabular-nums}
.nl .cell:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid var(--muted);z-index:0}
.nl .cell>*{position:relative;z-index:1;background:var(--surface);padding:2px 8px}
.slot{width:76px;height:42px;border:2px dashed var(--accent);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;padding:0 !important}
.slot.filled{border-style:solid;background:var(--soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tile{min-width:64px;min-height:44px;border-radius:8px;border:2px solid var(--warm);background:var(--warm-soft);color:var(--ink);font:inherit;font-weight:700;cursor:grab}
.tile.sel{background:var(--warm);color:#14213D}.tile.used{opacity:.3}
.graph{width:100%;max-width:700px;height:auto;display:block;background:var(--bg);border-radius:10px;touch-action:manipulation;cursor:crosshair;border:1px solid var(--line)}
.graph text{fill:var(--muted);font-family:var(--body)}
.sum{display:grid;gap:8px;margin-top:12px}
.sum div{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
.sum b{font-family:var(--display)}
.themebtn{font:inherit;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;min-height:40px}
.link{background:none;border:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0;min-height:0}
.tt td,.tt th{padding:6px 9px;font-size:.92rem;white-space:nowrap}.tt td.nm{text-align:left;font-weight:700}
.lis{float:right;display:inline-flex;align-items:center;gap:6px;margin:0 0 6px 10px;font:inherit;font-size:.9rem;font-weight:700;color:var(--accent);background:var(--surface);border:2px solid var(--accent);border-radius:99px;padding:4px 12px;min-height:36px;cursor:pointer}
.lis svg{width:18px;height:18px;fill:currentColor}.lis.on{background:var(--accent);color:var(--accent-ink)}
.nospeech .lis,.nospeech .speedbox{display:none}
.speedbox{font-size:.9rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-left:10px}
.speedbox select{min-height:36px;font-size:.9rem;padding:2px 8px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px;max-width:260px}
.bar i{display:block;height:100%;background:var(--warm);width:0;transition:width .4s}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}
  .rail h2{width:100%}
  .chip{padding:6px 10px}.chip small{display:none}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="h1">Ratio Coach</h1>
      <p class="sub" id="subt">Grade 6, Module 1 mid-module practice. Try it first, use hints when you need them.</p>
      <div class="bar" aria-hidden="true"><i id="pbar"></i></div>
      <p class="sub" id="who" style="margin-top:8px" aria-live="polite"></p>
    </div>
    <div><label class="speedbox" for="lng"><span id="lngl">Language</span> <select id="lng"><option value="en">English</option><option value="es">Español</option></select></label><label class="speedbox" for="spd"><span id="spdl">Reading speed</span> <select id="spd"><option value="0.75" id="o1">Slow</option><option value="0.95" id="o2" selected>Normal</option></select></label> <button class="themebtn" id="theme" type="button">Switch light / dark</button></div>
  </header>
  <nav class="rail" aria-label="Questions"><h2 id="railh">Your questions</h2><div id="chips" style="display:contents"></div></nav>

</div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function num(v){v=String(v==null?"":v).trim();if(/^-?\d+,\d{1,2}$/.test(v))v=v.replace(",",".");v=v.replace(/,/g,"");if(v==="")return NaN;var m=v.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);return /^-?\d*\.?\d+$/.test(v)?parseFloat(v):NaN}
function same(a,b){return Math.abs(a-b)<1e-9}
function numField(id,ph){return '<input type="text" inputmode="decimal" autocomplete="off" id="'+id+'" aria-label="'+esc(ph||"answer")+'">'}
function opts(n,id,label){var s='<select id="'+id+'" aria-label="'+label+'"><option value="">'+tx("choose")+'</option>';for(var i=0;i<=n;i++)s+='<option value="'+i+'">'+i+'</option>';return s+'</select>'}
var store={};
try{store=JSON.parse(localStorage.getItem("ratioCoach1")||"{}")||{}}catch(e){store={}}
function save(){try{localStorage.setItem("ratioCoach1",JSON.stringify(store))}catch(e){}}
var LANG="en";try{LANG=localStorage.getItem("ratioCoachLang")==="es"?"es":"en"}catch(e){}
function tx(k){if(LANG!=="es")return k;var v=TR[k];if(v===undefined){(window.__miss=window.__miss||{})[k]=1;return k}return v}

var TR={"Send my results to my teacher": "Enviar mis resultados a mi maestro o maestra", "Press the button, then paste this into the form or assignment your teacher gives you.": "Presiona el botón y luego pega esto en el formulario o la tarea que te dé tu maestro o maestra.", "Copy my results": "Copiar mis resultados", "Copied!": "¡Copiado!", "Select the text and copy it.": "Selecciona el texto y cópialo.","The equation P = ⅛F can be used to find the number of casts, given the number of fish caught.": "La ecuación P = ⅛F se puede usar para hallar el número de lanzamientos, dado el número de peces pescados.", "If James caught 32 fish, then he cast his pole 4 times.": "Si James pescó 32 peces, entonces lanzó su caña 4 veces.", "If James cast his pole 64 times, then he caught 8 fish.": "Si James lanzó su caña 64 veces, entonces pescó 8 peces.", "The equation F = ⅛P can be used to find the number of fish caught, given the number of casts.": "La ecuación F = ⅛P se puede usar para hallar el número de peces pescados, dado el número de lanzamientos.", "The equation F = 8P can be used to find the number of fish caught, given the number of casts.": "La ecuación F = 8P se puede usar para hallar el número de peces pescados, dado el número de lanzamientos.",". The equation that models it (<i>j<\/i> jellyfish, <i>t<\/i> turtles) is:": ". La ecuación que lo modela (<i>j<\/i> medusas, <i>t<\/i> tortugas) es:", "1 cupcake": "1 cupcake", "1 turtle: 12 ÷ 4 = <b>3<\/b> jellyfish.": "1 tortuga: 12 ÷ 4 = <b>3<\/b> medusas.", "10 bagels take 10 × 13.5 = <b>135<\/b> seconds.": "10 bagels tardan 10 × 13.5 = <b>135<\/b> segundos.", "10 cupcakes": "10 cupcakes", "12 ÷ 2 = 6, so multiply 5 by 6. 5 × 6 = 30 push-ups. The ratio is 30 : 12.": "12 ÷ 2 = 6, así que multiplica 5 por 6. 5 × 6 = 30 flexiones. La razón es 30 : 12.", "13.5 for one bagel is right. Now use it: 10 bagels takes 10 times as long as 1 bagel.": "13.5 para un bagel es correcto. Ahora úsalo: 10 bagels tardan 10 veces lo que tarda 1 bagel.", "135 is for 10 bagels, so it goes at the 10. One bagel takes much less time than 54 seconds, since 4 bagels take 54.": "135 es para 10 bagels, así que va en el 10. Un bagel tarda mucho menos que 54 segundos, porque 4 bagels tardan 54.", "15 and 7 are the ratio, not the real numbers of students. The real numbers are bigger.": "15 y 7 son la razón, no el número real de estudiantes. Los números reales son más grandes.", "15 ÷ 3 = 5 flies per frog. 7 × 5 = 35. 60 ÷ 5 = 12 frogs.": "15 ÷ 3 = 5 moscas por rana. 7 × 5 = 35. 60 ÷ 5 = 12 ranas.", "17 is every shape in the picture. A ratio of circles to squares only uses those two groups.": "17 es la cantidad de todas las figuras de la imagen. Una razón de círculos a cuadrados solo usa esos dos grupos.", "24 jellyfish: 24 ÷ 3 = <b>8<\/b> turtles. 14 turtles: 14 × 3 = <b>42<\/b> jellyfish. 60 jellyfish: 60 ÷ 3 = <b>20<\/b> turtles.": "24 medusas: 24 ÷ 3 = <b>8<\/b> tortugas. 14 tortugas: 14 × 3 = <b>42<\/b> medusas. 60 medusas: 60 ÷ 3 = <b>20<\/b> tortugas.", "24 ÷ 8 = 3, so we multiplied sit-ups by 3.": "24 ÷ 8 = 3, así que multiplicamos las abdominales por 3.", "249 is the number of <i>sold<\/i> morning tickets (3 × 83). The question asks for unsold.": "249 es el número de boletos <i>vendidos<\/i> en la mañana (3 × 83). La pregunta pide los que no se vendieron.", "35 ÷ 5 = 7. Leo: 9 × 7 = 63. In all: 35 + 63 = 98.": "35 ÷ 5 = 7. Leo: 9 × 7 = 63. En total: 35 + 63 = 98.", "4 bagels take 54 seconds, so 1 bagel takes 54 ÷ 4 = <b>13.5<\/b> seconds.": "4 bagels tardan 54 segundos, así que 1 bagel tarda 54 ÷ 4 = <b>13.5<\/b> segundos.", "4 ÷ 4 = 1, so 12 ÷ 4 = 3. Every turtle comes with 3 jellyfish. Use that rate for the rest of the rows.": "4 ÷ 4 = 1, así que 12 ÷ 4 = 3. Cada tortuga viene con 3 medusas. Usa esa tasa para el resto de las filas.", "42 ÷ 3 = 14 seconds each. 10 × 14 = 140 seconds.": "42 ÷ 3 = 14 segundos cada uno. 10 × 14 = 140 segundos.", "54 ÷ 4 = 13.5 seconds for one bagel. Which tile goes at the 1?": "54 ÷ 4 = 13.5 segundos por un bagel. ¿Qué ficha va en el 1?", "64 comes from 8 × 8. Both numbers in a ratio have to be multiplied by the <b>same<\/b> number.": "64 viene de 8 × 8. Los dos números de una razón se multiplican por el <b>mismo<\/b> número.", "664 is the total number of tickets on one kind of flight. The question asks only for the unsold morning tickets.": "664 es el total de boletos de un tipo de vuelo. La pregunta pide solo los boletos sin vender de los vuelos de la mañana.", "7 is Jordan's number in the ratio. Ask: what do you multiply 7 by to get 42? That same number multiplies 12.": "7 es el número de Jordan en la razón. Pregúntate: ¿por qué número multiplico 7 para obtener 42? Ese mismo número multiplica a 12.", "7 times what equals 42? Use the same multiplier on Ellen's side.": "¿7 por cuánto es 42? Usa el mismo multiplicador del lado de Ellen.", "8 = 4 × 2, so 3 × 2 = 6. 12 = 4 × 3, so 9. 20 = 4 × 5, so 15.": "8 = 4 × 2, así que 3 × 2 = 6. 12 = 4 × 3, así que 9. 20 = 4 × 5, así que 15.", "8 is the number of sit-ups in the <i>original<\/i> ratio. Last night he did more. Find how many pull-ups he did with 24 sit-ups.": "8 es el número de abdominales en la razón <i>original<\/i>. Anoche hizo más. Halla cuántas dominadas hizo con 24 abdominales.", "83 is the number of <i>unsold<\/i> tickets on <b>night<\/b> flights. You still need the morning flights.": "83 es el número de boletos <i>sin vender<\/i> en los vuelos de la <b>noche<\/b>. Todavía necesitas los vuelos de la mañana.", "9 − 4 = 5 more per group. 65 ÷ 5 = 13 groups. Bike: 9 × 13 = 117. Walk: 4 × 13 = 52.": "9 − 4 = 5 más por grupo. 65 ÷ 5 = 13 grupos. Bicicleta: 9 × 13 = 117. Caminando: 4 × 13 = 52.", "<b>Part B.<\/b> The ratio of <b>jellyfish to sea turtles<\/b> is": "<b>Parte B.<\/b> La razón de <b>medusas a tortugas marinas<\/b> es", "<p>A bagel store prepares 4 bagels in 54 seconds and 12 bagels in 162 seconds. At this rate, how many seconds will it take to prepare <b>10 bagels<\/b>? Fill the blanks in the double number line. Tap a number tile, then tap a blank. Tap a filled blank to take it back.<\/p>": "<p>Una tienda de bagels prepara 4 bagels en 54 segundos y 12 bagels en 162 segundos. A este ritmo, ¿cuántos segundos tardará en preparar <b>10 bagels<\/b>? Llena los espacios en blanco de la recta numérica doble. Toca una ficha de número y luego toca un espacio en blanco. Toca un espacio lleno para quitar la ficha.<\/p>", "<p>A group of students made tacos for lunch.<\/p><div class=\"scroll\"><table class=\"tbl\" data-say=\"Table of tacos. Jackie made 6. Manny made 6. Vinny made 2. Paula made 8. Marta made 4. Evelyn made 2.\"><tr><th>Student<\/th><td>Jackie<\/td><td>Manny<\/td><td>Vinny<\/td><td>Paula<\/td><td>Marta<\/td><td>Evelyn<\/td><\/tr><tr><th>Tacos<\/th><td>6<\/td><td>6<\/td><td>2<\/td><td>8<\/td><td>4<\/td><td>2<\/td><\/tr><\/table><\/div><p>Which answer choices describe the ratio <b class=\"mathy\">6 : 4<\/b>? Select all that apply.<\/p>": "<p>Un grupo de estudiantes hizo tacos para el almuerzo.<\/p><div class=\"scroll\"><table class=\"tbl\" data-say=\"Tabla de tacos. Jackie hizo 6. Manny hizo 6. Vinny hizo 2. Paula hizo 8. Marta hizo 4. Evelyn hizo 2.\"><tr><th>Estudiante<\/th><td>Jackie<\/td><td>Manny<\/td><td>Vinny<\/td><td>Paula<\/td><td>Marta<\/td><td>Evelyn<\/td><\/tr><tr><th>Tacos<\/th><td>6<\/td><td>6<\/td><td>2<\/td><td>8<\/td><td>4<\/td><td>2<\/td><\/tr><\/table><\/div><p>¿Qué opciones describen la razón <b class=\"mathy\">6 : 4<\/b>? Selecciona todas las que apliquen.<\/p>", "<p>Alex saw 4 sea turtles and 12 jellyfish. This ratio stayed the same for the rest of his dive.<\/p><p><b>Part A.<\/b> Complete the table.<\/p>": "<p>Alex vio 4 tortugas marinas y 12 medusas. Esta razón se mantuvo igual durante el resto de su inmersión.<\/p><p><b>Parte A.<\/b> Completa la tabla.<\/p>", "<p>An airline offers the <b>same number of tickets<\/b> for morning and night flights. The ratio of sold tickets to unsold tickets was <b>3 : 5<\/b> on morning flights and <b>7 : 1<\/b> on night flights. The airline sells 581 tickets on night flights. How many unsold tickets can it expect on morning flights?<\/p>": "<p>Una aerolínea ofrece la <b>misma cantidad de boletos<\/b> para vuelos de la mañana y de la noche. La razón de boletos vendidos a boletos sin vender fue <b>3 : 5<\/b> en los vuelos de la mañana y <b>7 : 1<\/b> en los vuelos de la noche. La aerolínea vende 581 boletos en los vuelos de la noche. ¿Cuántos boletos sin vender puede esperar en los vuelos de la mañana?<\/p>", "<p>For every 15 students who run track, 7 students play baseball. There are <b>112 more<\/b> students who run track than play baseball. How many students run track? How many play baseball?<\/p>": "<p>Por cada 15 estudiantes que corren pista, 7 estudiantes juegan béisbol. Hay <b>112 más<\/b> estudiantes que corren pista que los que juegan béisbol. ¿Cuántos estudiantes corren pista? ¿Cuántos juegan béisbol?<\/p>", "<p>Garson always does 3 pull-ups for every 8 sit-ups. Last night he did 24 sit-ups. Which ratio shows the relationship between the number of <b>pull-ups<\/b> and the number of <b>sit-ups<\/b> last night?<\/p>": "<p>Garson siempre hace 3 dominadas por cada 8 abdominales. Anoche hizo 24 abdominales. ¿Qué razón muestra la relación entre el número de <b>dominadas<\/b> y el número de <b>abdominales<\/b> de anoche?<\/p>", "<p>James went fishing. The ratio of the number of casts, <i>P<\/i>, to the number of fish he caught, <i>F<\/i>, was <b>8 : 1<\/b>. Select <b>all<\/b> the true statements. A ratio table can help.<\/p>": "<p>James fue a pescar. La razón del número de lanzamientos de su caña, <i>P<\/i>, al número de peces que pescó, <i>F<\/i>, fue <b>8 : 1<\/b>. Selecciona <b>todos<\/b> los enunciados verdaderos. Una tabla de razones puede ayudarte.<\/p>", "<p>Jordan recycles 7 cans for every 12 cans Ellen recycles. Last week, Jordan recycled 42 cans.<\/p><p>What number, <i>c<\/i>, can be multiplied by 12 to find how many cans Ellen recycled? How many cans did Jordan and Ellen recycle <b>in all<\/b>?<\/p>": "<p>Jordan recicla 7 latas por cada 12 latas que recicla Ellen. La semana pasada, Jordan recicló 42 latas.<\/p><p>¿Qué número, <i>c<\/i>, se puede multiplicar por 12 para hallar cuántas latas recicló Ellen? ¿Cuántas latas reciclaron Jordan y Ellen <b>en total<\/b>?<\/p>", "<p>Look at the picture. What is the ratio of the number of <b>circles<\/b> to the number of <b>squares<\/b>?<\/p><p class=\"sub\">Tip: tap a shape to mark it as you count.<\/p>": "<p>Mira la imagen. ¿Cuál es la razón del número de <b>círculos<\/b> al número de <b>cuadrados<\/b>?<\/p><p class=\"sub\">Consejo: toca una figura para marcarla mientras cuentas.<\/p>", "<p>To make a darker orange, the class mixes <b>5 ounces of red paint to 3 ounces of yellow paint<\/b>. Find the yellow paint for each red amount. Then click the grid to plot points A, B, and C. Click a point again to remove it.<\/p>": "<p>Para hacer un naranja más oscuro, la clase mezcla <b>5 onzas de pintura roja con 3 onzas de pintura amarilla<\/b>. Halla la pintura amarilla para cada cantidad de rojo. Luego haz clic en la cuadrícula para marcar los puntos A, B y C. Haz clic en un punto otra vez para quitarlo.<\/p>", "A bag has 9 red marbles, 5 blue marbles, and 4 green marbles. What is the ratio of red marbles to blue marbles?": "Una bolsa tiene 9 canicas rojas, 5 canicas azules y 4 canicas verdes. ¿Cuál es la razón de canicas rojas a canicas azules?", "A baker decorates 3 cupcakes in 42 seconds. At this rate, how many seconds for 1 cupcake? How many seconds for 10 cupcakes?": "Un panadero decora 3 cupcakes en 42 segundos. A este ritmo, ¿cuántos segundos tarda en decorar 1 cupcake? ¿Cuántos segundos tarda en decorar 10 cupcakes?", "A coordinate grid. Red paint is on the horizontal axis and yellow paint is on the vertical axis.": "Una cuadrícula de coordenadas. La pintura roja está en el eje horizontal y la pintura amarilla está en el eje vertical.", "A: (5, 3). That is the ratio itself.": "A: (5, 3). Esa es la razón misma.", "Add sold and unsold on night flights to get the total number of tickets. Morning has the same total.": "Suma los vendidos y los no vendidos de los vuelos de la noche para obtener el total de boletos. La mañana tiene el mismo total.", "After you find Ellen's cans, add Jordan's cans and Ellen's cans together.": "Después de hallar las latas de Ellen, suma las latas de Jordan y las latas de Ellen.", "Airline tickets": "Boletos de aerolínea", "Almost ready.": "Ya casi.", "Ana made 3 tacos, Ben made 5, Cy made 2, and Di made 1. What is the ratio of Ben's tacos to Cy and Di's tacos together?": "Ana hizo 3 tacos, Ben hizo 5, Cy hizo 2 y Di hizo 1. ¿Cuál es la razón de los tacos de Ben a los tacos de Cy y Di juntos?", "Another hint ({0}/3)": "Otra pista ({0}/3)", "At least one you picked is false. Test each number statement with the 8 : 1 ratio, and check which variable the equation solves for.": "Al menos una de las que elegiste es falsa. Prueba cada enunciado con números usando la razón 8 : 1 y revisa qué variable despeja la ecuación.", "B: 15 ÷ 5 = 3, so 3 × 3 = 9. Point <b>(15, 9)<\/b>.": "B: 15 ÷ 5 = 3, así que 3 × 3 = 9. Punto <b>(15, 9)<\/b>.", "B: 3 × 3 = 9. For C: 20 is 5 × 4, so multiply 3 by 4.": "B: 3 × 3 = 9. Para C: 20 es 5 × 4, así que multiplica 3 por 4.", "Bagels": "Bagels", "Bagels with cream cheese": "Bagels con queso crema", "Ben": "Ben", "C: 20 ÷ 5 = 4, so 3 × 4 = 12. Point <b>(20, 12)<\/b>.": "C: 20 ÷ 5 = 4, así que 3 × 4 = 12. Punto <b>(20, 12)<\/b>.", "Casts = 6 × fish: 6 × 7 = 42. Fish = casts ÷ 6: 54 ÷ 6 = 9.": "Lanzamientos = 6 × peces: 6 × 7 = 42. Peces = lanzamientos ÷ 6: 54 ÷ 6 = 9.", "Casts are always bigger than fish. Which number should be the big one in a number statement?": "Los lanzamientos siempre son más que los peces. ¿Cuál número debe ser el más grande en un enunciado con números?", "Change name": "Cambiar nombre", "Check": "Revisar", "Check my answer": "Revisar mi respuesta", "Check the table. Every row must have the same ratio as 4 : 12. Find how many jellyfish there are for <b>1<\/b> turtle first, then use it for other rows.": "Revisa la tabla. Cada fila debe tener la misma razón que 4 : 12. Primero halla cuántas medusas hay por <b>1<\/b> tortuga y luego úsalo en las otras filas.", "Check the yellow amounts. For every 5 red there are 3 yellow. How many groups of 5 are in 15? In 20?": "Revisa las cantidades de amarillo. Por cada 5 de rojo hay 3 de amarillo. ¿Cuántos grupos de 5 hay en 15? ¿Y en 20?", "Check with 12 bagels: 12 × 13.5 = 162. ✓ The rate is steady.": "Comprueba con 12 bagels: 12 × 13.5 = 162. ✓ El ritmo es constante.", "Check your points. Each point is (red, yellow). Go <b>right<\/b> by the red amount first, then <b>up<\/b> by the yellow amount.": "Revisa tus puntos. Cada punto es (rojo, amarillo). Ve primero a la <b>derecha<\/b> la cantidad de rojo y luego <b>hacia arriba<\/b> la cantidad de amarillo.", "Check: 210 − 98 = 112. ✓": "Comprueba: 210 − 98 = 112. ✓", "Checking whether your progress can be saved for your teacher...": "Revisando si tu progreso se puede guardar para tu maestro o maestra...", "Circles come first, so the ratio is <b>7 to 6<\/b>. Triangles are not in this ratio.": "Los círculos van primero, así que la razón es <b>7 a 6<\/b>. Los triángulos no están en esta razón.", "Circles to squares": "Círculos a cuadrados", "Close, but not yet.": "Cerca, pero todavía no.", "Coordinate grid, red paint on the horizontal axis from 0 to 24, yellow paint on the vertical axis from 0 to 19. Click to plot points.": "Cuadrícula de coordenadas, pintura roja en el eje horizontal de 0 a 24, pintura amarilla en el eje vertical de 0 a 19. Haz clic para marcar puntos.", "Count the circles: 4 in the top row, 2 in the middle row, 1 in the bottom row. That makes <b>7<\/b>.": "Cuenta los círculos: 4 en la fila de arriba, 2 en la fila del medio, 1 en la fila de abajo. Son <b>7<\/b>.", "Count the squares: 2 in each of the three rows. That makes <b>6<\/b>.": "Cuenta los cuadrados: 2 en cada una de las tres filas. Son <b>6<\/b>.", "Cy + Di": "Cy + Di", "Cy and Di made 2 + 1 = 3 tacos together. Ben first: 5 : 3.": "Cy y Di hicieron 2 + 1 = 3 tacos juntos. Ben primero: 5 : 3.", "Do the same to pull-ups: 3 × 3 = <b>9<\/b>.": "Haz lo mismo con las dominadas: 3 × 3 = <b>9<\/b>.", "Double number line. Bagels: 0, 1, 4, 10, 12. Seconds: 0, blank, 54, blank, 162.": "Recta numérica doble. Bagels: 0, 1, 4, 10, 12. Segundos: 0, espacio en blanco, 54, espacio en blanco, 162.", "Ellen recycled 12 × 6 = <b>72<\/b> cans.": "Ellen recicló 12 × 6 = <b>72<\/b> latas.", "Equations from ratios": "Ecuaciones a partir de razones", "Fill in every box first.": "Primero llena todos los espacios.", "Fill in or choose every answer first, then check.": "Primero llena o elige todas las respuestas y luego revisa.", "Find the unit rate: how many seconds for 1 bagel? 4 bagels take 54 seconds.": "Halla la tasa unitaria: ¿cuántos segundos tarda 1 bagel? 4 bagels tardan 54 segundos.", "Finished with help": "Terminé con ayuda", "First and last name": "Nombre y apellido", "Fishing trip": "Viaje de pesca", "For 1 bagel, split 54 seconds into 4 equal parts. Then multiply to get 10 bagels.": "Para 1 bagel, divide 54 segundos en 4 partes iguales. Luego multiplica para obtener 10 bagels.", "For A: 5 red goes with 3 yellow. For B: 15 is 5 × 3. What do you do to the 3?": "Para A: 5 de rojo van con 3 de amarillo. Para B: 15 es 5 × 3. ¿Qué le haces al 3?", "For an equation, ask: to get F from P, do I divide by 8 or multiply by 8? Dividing by 8 is the same as multiplying by ⅛.": "Para una ecuación, pregunta: para obtener F a partir de P, ¿divido entre 8 o multiplico por 8? Dividir entre 8 es lo mismo que multiplicar por ⅛.", "For each choice, find the two numbers it describes. First number first, second number second.": "En cada opción, halla los dos números que describe. El primer número va primero y el segundo va segundo.", "For every 9 students who bike to school, 4 walk. There are 65 more students who bike than walk. How many bike? How many walk?": "Por cada 9 estudiantes que van a la escuela en bicicleta, 4 van caminando. Hay 65 más estudiantes que van en bicicleta que los que caminan. ¿Cuántos van en bicicleta? ¿Cuántos caminan?", "For the equation, jellyfish = 3 × turtles. Test it with t = 4: does it give 12?": "Para la ecuación, medusas = 3 × tortugas. Pruébala con t = 4: ¿da 12?", "Friday: 25 ÷ 5 = 5 unsold, total 30. Monday has 2 + 3 = 5 parts, 30 ÷ 5 = 6 each. Unsold is 3 × 6 = 18.": "Viernes: 25 ÷ 5 = 5 sin vender, total 30. El lunes tiene 2 + 3 = 5 partes, 30 ÷ 5 = 6 cada una. Los no vendidos son 3 × 6 = 18.", "Give me a hint": "Dame una pista", "Grade 6, Module 1 mid-module practice. Try it first, use hints when you need them.": "Sexto grado, Módulo 1, práctica de mitad de módulo. Inténtalo primero y usa las pistas cuando las necesites.", "Hint {0} of 3:": "Pista {0} de 3:", "How many times bigger is 24 than 8?": "¿Cuántas veces más grande es 24 que 8?", "In all: 42 + 72 = <b>114<\/b> cans.": "En total: 42 + 72 = <b>114<\/b> latas.", "In one 'group', 15 run track and 7 play baseball. How many <i>more<\/i> run track in one group?": "En un 'grupo', 15 corren pista y 7 juegan béisbol. ¿Cuántos <i>más<\/i> corren pista en un grupo?", "Jackie 6 and Marta 4 gives <b>6 : 4<\/b>. Yes.": "Jackie 6 y Marta 4 da <b>6 : 4<\/b>. Sí.", "Jellyfish": "Medusas", "Jellyfish are always 3 times the turtles: <b>j = 3t<\/b>.": "Las medusas siempre son 3 veces las tortugas: <b>j = 3t<\/b>.", "Jellyfish to turtles: <b>3 : 1<\/b>.": "Medusas a tortugas: <b>3 : 1<\/b>.", "Jordan 7 ↔ 42 means we multiplied by 42 ÷ 7 = <b>6<\/b>. So <b>c = 6<\/b>.": "Jordan 7 ↔ 42 significa que multiplicamos por 42 ÷ 7 = <b>6<\/b>. Entonces <b>c = 6<\/b>.", "Jordan and Ellen recycled": "Jordan y Ellen reciclaron", "Kai reads 5 pages for every 9 pages Leo reads. Kai read 35 pages. How many pages did Leo read? How many did they read in all?": "Kai lee 5 páginas por cada 9 páginas que lee Leo. Kai leyó 35 páginas. ¿Cuántas páginas leyó Leo? ¿Cuántas leyeron en total?", "Language": "Idioma", "Last night's ratio is <b>9 : 24<\/b>.": "La razón de anoche es <b>9 : 24<\/b>.", "Leo": "Leo", "Listen": "Escuchar", "Look at how many groups of 15 and 7 you need so the difference is 112. Start with 15 − 7.": "Fíjate cuántos grupos de 15 y de 7 necesitas para que la diferencia sea 112. Empieza con 15 − 7.", "Look at the order too. 4 : 6 is not the same ratio as 6 : 4.": "Fíjate también en el orden. 4 : 6 no es la misma razón que 6 : 4.", "Make a ratio table. Casts P : fish F. 8 casts go with 1 fish, 16 casts with 2 fish, and so on.": "Haz una tabla de razones. Lanzamientos P : peces F. 8 lanzamientos van con 1 pez, 16 lanzamientos con 2 peces, y así sucesivamente.", "Make a ratio table. Jordan's column: 7 and 42. Ellen's column: 12 and ?": "Haz una tabla de razones. Columna de Jordan: 7 y 42. Columna de Ellen: 12 y ?", "Manny 6, Evelyn and Vinny 2 + 2 = 4 gives <b>6 : 4<\/b>. Yes.": "Manny 6, Evelyn y Vinny 2 + 2 = 4 da <b>6 : 4<\/b>. Sí.", "Manny to Marta is <b>6 : 4<\/b>. Yes.": "Manny a Marta es <b>6 : 4<\/b>. Sí.", "Marked:": "Marcadas:", "Marta to Manny is 4 : 6. The order is flipped. No.": "Marta a Manny es 4 : 6. El orden está al revés. No.", "Mia does 5 push-ups for every 2 laps she runs. She ran 12 laps. How many push-ups did she do?": "Mia hace 5 flexiones por cada 2 vueltas que corre. Corrió 12 vueltas. ¿Cuántas flexiones hizo?", "Morning has the same total: <b>664<\/b> tickets.": "La mañana tiene el mismo total: <b>664<\/b> boletos.", "Morning ratio 3 : 5 has 3 + 5 = 8 parts. One part is 664 ÷ 8 = <b>83<\/b>.": "La razón de la mañana 3 : 5 tiene 3 + 5 = 8 partes. Una parte es 664 ÷ 8 = <b>83<\/b>.", "Morning ratio 3 : 5 has 3 + 5 = 8 parts. Split the total into 8 equal parts, then take the unsold ones.": "La razón de la mañana 3 : 5 tiene 3 + 5 = 8 partes. Divide el total en 8 partes iguales y luego toma las partes sin vender.", "Multiply both 3 and 8 by that same number.": "Multiplica 3 y 8 por ese mismo número.", "Multiply each part of the ratio, 15 and 7, by the number of groups.": "Multiplica cada parte de la razón, 15 y 7, por el número de grupos.", "My results": "Mis resultados", "Next question": "Siguiente pregunta", "Nice work sticking with it. Try the similar problem to lock it in.": "Buen trabajo por seguir intentándolo. Prueba el problema parecido para reforzarlo.", "Nice work.": "Buen trabajo.", "Night flights: 7 sold for every 1 unsold. If 581 are sold, how many unsold?": "Vuelos de la noche: 7 vendidos por cada 1 sin vender. Si se venden 581, ¿cuántos quedan sin vender?", "Night: 581 ÷ 7 = <b>83<\/b>, so 83 unsold. Total night tickets: 581 + 83 = <b>664<\/b>.": "Noche: 581 ÷ 7 = <b>83<\/b>, así que 83 sin vender. Total de boletos de la noche: 581 + 83 = <b>664<\/b>.", "No more hints": "No hay más pistas", "No points plotted yet.": "Todavía no has marcado puntos.", "Normal": "Normal", "Not finished": "Sin terminar", "Not quite yet.": "Todavía no.", "Not yet. Count only the circles, then count only the squares. Ignore the triangles.": "Todavía no. Cuenta solo los círculos y luego cuenta solo los cuadrados. Ignora los triángulos.", "Not yet. Start with night flights. Find how many total tickets that is, since morning has the same total.": "Todavía no. Empieza con los vuelos de la noche. Halla cuántos boletos hay en total, porque la mañana tiene el mismo total.", "Now 10 bagels take 10 × 13.5 seconds. Which tile is that?": "Ahora 10 bagels tardan 10 × 13.5 segundos. ¿Qué ficha es esa?", "Number tiles": "Fichas de números", "Number tiles: 13.5, 135, 60, 160, 81, 108.": "Fichas de números: 13.5, 135, 60, 160, 81, 108.", "On Friday the ratio of sold to unsold tickets is 5 : 1. On Monday it is 2 : 3. Both days have the same total number of tickets. 25 tickets were sold on Friday. How many are unsold on Monday?": "El viernes la razón de boletos vendidos a no vendidos es 5 : 1. El lunes es 2 : 3. Los dos días tienen el mismo número total de boletos. El viernes se vendieron 25 boletos. ¿Cuántos quedan sin vender el lunes?", "On my own": "Por mi cuenta", "One group has 8 more track students. You need 112 more. How many groups is that?": "Un grupo tiene 8 estudiantes más en pista. Necesitas 112 más. ¿Cuántos grupos son?", "One group: 15 − 7 = <b>8<\/b> more students run track.": "Un grupo: 15 − 7 = <b>8<\/b> estudiantes más corren pista.", "One of your numbers is right. Count the other shape again, and mark each one as you go so you don't skip any.": "Uno de tus números es correcto. Cuenta otra vez la otra figura y marca cada una al contar para no saltarte ninguna.", "Orange paint graph": "Gráfica de pintura naranja", "Ordered pair": "Par ordenado", "Original ratio, pull-ups to sit-ups: <b>3 : 8<\/b>.": "Razón original, dominadas a abdominales: <b>3 : 8<\/b>.", "Ounces of red paint": "Onzas de pintura roja", "Ounces of yellow paint": "Onzas de pintura amarilla", "Part-to-part and part-to-whole": "Razones parte a parte y parte a todo", "Part-to-part with a difference": "Parte a parte con una diferencia", "Paula 8, Jackie and Manny 6 + 6 = 12 gives 8 : 12. No.": "Paula 8, Jackie y Manny 6 + 6 = 12 da 8 : 12. No.", "Picture of circles, squares, and triangles. Look at the picture and count.": "Imagen de círculos, cuadrados y triángulos. Mira la imagen y cuenta.", "Please type your first and last name.": "Por favor escribe tu nombre y apellido.", "Plot each: right for red (x), then up for yellow (y). The three points line up in a straight line through (0, 0).": "Marca cada uno: a la derecha para rojo (x) y luego hacia arriba para amarillo (y). Los tres puntos quedan en una línea recta que pasa por (0, 0).", "Plotted:": "Puntos marcados:", "Point": "Punto", "Pull-ups and sit-ups": "Dominadas y abdominales", "Put 13.5 at the 1 and 135 at the 10.": "Pon 13.5 en el 1 y 135 en el 10.", "Question {0} of 10": "Pregunta {0} de 10", "Ratio 8 : 1 means <b>P = 8F<\/b> (casts are 8 times the fish) and <b>F = P ÷ 8 = ⅛P<\/b>.": "La razón 8 : 1 significa <b>P = 8F<\/b> (los lanzamientos son 8 veces los peces) y <b>F = P ÷ 8 = ⅛P<\/b>.", "Ratio Coach": "Entrenador de Razones", "Ratio tables and equations": "Tablas de razones y ecuaciones", "Ratio tables: part-to-part": "Tablas de razones: parte a parte", "Ratio words come in order. 'Circles to squares' means the circle count goes first.": "Las palabras de una razón van en orden. 'Círculos a cuadrados' significa que el número de círculos va primero.", "Ratios and equivalent ratios": "Razones y razones equivalentes", "Ratios on a coordinate plane": "Razones en el plano de coordenadas", "Read this aloud": "Leer esto en voz alta", "Reading ratio language": "Cómo leer el lenguaje de razones", "Reading speed": "Velocidad de lectura", "Recycling cans": "Latas recicladas", "Red": "Rojo", "Red first, blue second: 9 to 5. The 4 green marbles are not part of this ratio.": "Rojas primero, azules segundo: 9 a 5. Las 4 canicas verdes no forman parte de esta razón.", "Review these ideas before the test:": "Repasa estas ideas antes del examen:", "Right numbers, wrong order. The question says circles <b>to<\/b> squares, so circles come first.": "Los números están bien, pero en el orden equivocado. La pregunta dice círculos <b>a<\/b> cuadrados, así que los círculos van primero.", "Sea turtles": "Tortugas marinas", "Seconds": "Segundos", "See my results": "Ver mis resultados", "Shapes": "Figuras", "Show me how": "Muéstrame cómo", "Slow": "Lenta", "Start": "Empezar", "Start over": "Empezar de nuevo", "Start with 4 turtles : 12 jellyfish. What is the ratio when there is just 1 turtle?": "Empieza con 4 tortugas : 12 medusas. ¿Cuál es la razón cuando hay solo 1 tortuga?", "Statement 1: P = ⅛F would make casts <i>smaller<\/i> than fish. False.": "Enunciado 1: P = ⅛F haría que los lanzamientos fueran <i>menos<\/i> que los peces. Falso.", "Statement 2: 32 fish means 32 × 8 = 256 casts, not 4. False.": "Enunciado 2: 32 peces significan 32 × 8 = 256 lanzamientos, no 4. Falso.", "Statement 3: 64 casts ÷ 8 = <b>8 fish<\/b>. True.": "Enunciado 3: 64 lanzamientos ÷ 8 = <b>8 peces<\/b>. Verdadero.", "Statement 4: F = ⅛P. True.": "Enunciado 4: F = ⅛P. Verdadero.", "Statement 5: F = 8P would mean 8 fish per cast. False.": "Enunciado 5: F = 8P significaría 8 peces por lanzamiento. Falso.", "Stop": "Parar", "Switch light / dark": "Cambiar claro / oscuro", "Table for points A, B, and C. Point A: red 5, yellow blank. Point B: red 15, yellow blank. Point C: red 20, yellow blank.": "Tabla para los puntos A, B y C. Punto A: rojo 5, amarillo espacio en blanco. Punto B: rojo 15, amarillo espacio en blanco. Punto C: rojo 20, amarillo espacio en blanco.", "Table with two columns, sea turtles and jellyfish. Row 1 has 1 turtle and blank jellyfish. Row 2 has 4 turtles and 12 jellyfish. Row 3 has blank turtles and 24 jellyfish. Row 4 has 14 turtles and blank jellyfish. Row 5 has blank turtles and 60 jellyfish.": "Tabla con dos columnas, tortugas marinas y medusas. La fila 1 tiene 1 tortuga y espacio en blanco medusas. La fila 2 tiene 4 tortugas y 12 medusas. La fila 3 tiene espacio en blanco tortugas y 24 medusas. La fila 4 tiene 14 tortugas y espacio en blanco medusas. La fila 5 tiene espacio en blanco tortugas y 60 medusas.", "Taco table": "Tabla de tacos", "Tap every circle and read the counter. Write it down. Then clear and do the squares.": "Toca cada círculo y lee el contador. Anótalo. Luego borra y haz los cuadrados.", "That's right!": "¡Correcto!", "The airline can expect": "La aerolínea puede esperar", "The difference is 112, but the ratio is off. Check that your numbers are in the ratio 15 : 7.": "La diferencia es 112, pero la razón no coincide. Revisa que tus números estén en la razón 15 : 7.", "The numbers are right but flipped. Pull-ups should come first.": "Los números son correctos pero están al revés. Las dominadas deben ir primero.", he question asks jellyfish <b>to<\/b> turtles. Jellyfish go first.": "La tabla está bien. En la Parte B, la pregunta pide medusas <b>a<\/b> tortugas. Las medusas van primero.", "There are": "Hay", "There are 7 circles. How many squares are there? Count carefully, there are 17 shapes in all.": "Hay 7 círculos. ¿Cuántos cuadrados hay? Cuenta con cuidado, hay 17 figuras en total.", "There are more that fit. Some choices add two students together first.": "Hay más que encajan. Algunas opciones suman dos estudiantes primero.", "Think: 7 times what number is 42? That is c.": "¿7 por qué número es 42? Ese es c.", "To plot (5, 3), start at 0, go right 5, then up 3. Plot all three points.": "Para marcar (5, 3), empieza en 0, ve 5 a la derecha y luego 3 hacia arriba. Marca los tres puntos.", "Track and baseball": "Pista y béisbol", "Track: 15 × 14 = <b>210<\/b>. Baseball: 7 × 14 = <b>98<\/b>.": "Pista: 15 × 14 = <b>210<\/b>. Béisbol: 7 × 14 = <b>98<\/b>.", "Try a similar one": "Prueba uno parecido", "Try it or use two hints first": "Inténtalo o usa dos pistas primero", "Try the similar problems to keep your skills sharp.": "Prueba los problemas parecidos para mantener tus habilidades afiladas.", "Turtles and jellyfish": "Tortugas y medusas", "Type your name to begin": "Escribe tu nombre para empezar", "Unit rate and double number lines": "Tasa unitaria y rectas numéricas dobles", "Unsold is 5 parts: 5 × 83 = <b>415<\/b>.": "Los no vendidos son 5 partes: 5 × 83 = <b>415<\/b>.", "Use the same steps you used above. Try again.": "Usa los mismos pasos que usaste arriba. Inténtalo otra vez.", "Vinny and Marta 2 + 4 = 6, Vinny and Evelyn 2 + 2 = 4 gives <b>6 : 4<\/b>. Yes.": "Vinny y Marta 2 + 4 = 6, Vinny y Evelyn 2 + 2 = 4 da <b>6 : 4<\/b>. Sí.", "We need 112 more: 112 ÷ 8 = <b>14<\/b> groups.": "Necesitamos 112 más: 112 ÷ 8 = <b>14<\/b> grupos.", "Welcome": "Bienvenido(a)", "When a choice says 'X and Y together', add those two students' tacos before comparing.": "Cuando una opción dice 'X y Y juntos', suma los tacos de esos dos estudiantes antes de comparar.", "Worked solution": "Solución paso a paso", "Working as": "Trabajando como", "Writing a ratio": "Escribir una razón", "Yellow": "Amarillo", "Yes! Same idea, new numbers.": "¡Sí! La misma idea, con números nuevos.", "You already have 3 points. Click one to remove it first.": "Ya tienes 3 puntos. Haz clic en uno para quitarlo primero.", "You are missing at least one true statement.": "Te falta al menos un enunciado verdadero.", "You are signed in as the teacher.": "Has iniciado sesión como maestro o maestra.", "You finished all 10!": "¡Terminaste las 10!", "You got it on your own. Try the similar problem if you want a challenge.": "Lo lograste por tu cuenta. Prueba el problema parecido si quieres un reto.", "You picked some that don't equal 6 : 4. Check the order and the totals.": "Elegiste algunas que no son iguales a 6 : 4. Revisa el orden y los totales.", "Your numbers are in the ratio 15 : 7, but they don't differ by 112.": "Tus números están en la razón 15 : 7, pero no se diferencian por 112.", "Your progress is being saved for your teacher.": "Tu progreso se está guardando para tu maestro o maestra.", "Your questions": "Tus preguntas", "Your table is right. Now plot all three points: (red, yellow).": "Tu tabla está bien. Ahora marca los tres puntos: (rojo, amarillo).", "Your teacher can see your name, which questions you finish, how many hints you use, and how long you work.": "Tu maestro o maestra puede ver tu nombre, qué preguntas terminas, cuántas pistas usas y cuánto tiempo trabajas.", "Your teacher can't see your progress from this device. Use the Copy my results button on your results page when you finish.": "Tu maestro o maestra no puede ver tu progreso desde este dispositivo. Usa el botón Copiar mis resultados en tu página de resultados cuando termines.", "Zoe sees 3 frogs for every 15 flies. How many flies for 1 frog? How many flies for 7 frogs? How many frogs go with 60 flies?": "Zoe ve 3 ranas por cada 15 moscas. ¿Cuántas moscas hay por 1 rana? ¿Cuántas moscas hay por 7 ranas? ¿Cuántas ranas van con 60 moscas?", "baseball": "béisbol", "bike": "bicicleta", "blank": "espacio en blanco", "blue": "azul", "c = 6 is correct. For the total, find Ellen's cans (12 × 6) and add Jordan's 42.": "c = 6 es correcto. Para el total, halla las latas de Ellen (12 × 6) y suma las 42 de Jordan.", "c = 6 is right. 72 is only Ellen's cans. 'In all' means Jordan <b>plus<\/b> Ellen.": "c = 6 es correcto. 72 son solo las latas de Ellen. 'En total' significa Jordan <b>más<\/b> Ellen.", "cans last week.": "latas la semana pasada.", "casts for 7 fish": "lanzamientos para 7 peces", "choose": "elige", "circle": "círculo", "circles": "círculos", "correct": "correcto", "finished with help": "terminado con ayuda", "fish for 54 casts": "peces con 54 lanzamientos", "flies for 1 frog": "moscas por 1 rana", "flies for 7 frogs": "moscas por 7 ranas", "frogs for 60 flies": "ranas con 60 moscas", "in all": "en total", "jellyfish": "medusas", "not finished": "sin terminar", "push-ups": "flexiones", "red": "rojas", "seconds for 1 bagel": "segundos para 1 bagel", "seconds for 10 bagels": "segundos para 10 bagels", "square": "cuadrado", "squares": "cuadrados", "students who play baseball.": "estudiantes que juegan béisbol.", "students who run track and": "estudiantes que corren pista y", "to": "a", "total cans": "total de latas", "track": "pista", "triangle": "triángulo", "turtles": "tortugas", "unsold Monday": "sin vender el lunes", "unsold tickets": "boletos sin vender", "unsold tickets on morning flights.": "boletos sin vender en los vuelos de la mañana.", "walk": "caminan", "with 12": "con 12", "with 20": "con 20", "with 8": "con 8", "yellow for": "amarillo para", "{0} of 10 finished": "{0} de 10 terminadas", "{0} on your own, {1} with hints or a worked solution.": "{0} por tu cuenta, {1} con pistas o con la solución paso a paso."};

{skill:"Writing a ratio",short:"Circles to squares",
 prompt:'<p>Look at the picture. What is the ratio of the number of <b>circles</b> to the number of <b>squares</b>?</p><p class="sub">Tip: tap a shape to mark it as you count.</p>',
 body:function(){var t="csccsc"+"scTcTs"+"TssCT"; var arr="c s c c s c s c t c s t t s s c t".split(" ");
  var h='<div class="shapes" role="group" aria-label="'+tx("Shapes")+'" data-say="'+tx("Picture of circles, squares, and triangles. Look at the picture and count.")+'">'+arr.map(function(k,i){return '<button type="button" class="shape '+k+'" aria-label="'+tx({c:"circle",s:"square",t:"triangle"}[k])+'"><i></i></button>'}).join("")+'</div><div class="mathy" id="mk" aria-live="polite">'+tx("Marked:")+' 0</div>';
  h+='<div class="sentence">'+tx("The ratio of circles to squares is")+' '+opts(20,"a",tx("circles"))+' '+tx("to")+' '+opts(20,"b",tx("squares"))+'.</div>';return h},
 bind:function(r){$$(".shape",r).forEach(function(b){b.addEventListener("click",function(){b.classList.toggle("m");$("#mk",r).textContent=tx("Marked:")+" "+$$(".shape.m",r).length})})},
 check:function(r){var a=$("#a",r).value,b=$("#b",r).value;if(a===""||b==="")return{empty:1};a=+a;b=+b;
  if(a===7&&b===6)return{ok:1};
  if(a===6&&b===7)return{msg:tx("Right numbers, wrong order. The question says circles <b>to</b> squares, so circles come first.")};
  if(a===7&&b===17)return{msg:tx("17 is every shape in the picture. A ratio of circles to squares only uses those two groups.")};
  if(a===7||b===6)return{msg:tx("One of your numbers is right. Count the other shape again, and mark each one as you go so you don't skip any.")};
  return{msg:tx("Not yet. Count only the circles, then count only the squares. Ignore the triangles.")}},
 hints:["Ratio words come in order. 'Circles to squares' means the circle count goes first.","Tap every circle and read the counter. Write it down. Then clear and do the squares.","There are 7 circles. How many squares are there? Count carefully, there are 17 shapes in all."],
 how:["Count the circles: 4 in the top row, 2 in the middle row, 1 in the bottom row. That makes <b>7</b>.","Count the squares: 2 in each of the three rows. That makes <b>6</b>.","Circles come first, so the ratio is <b>7 to 6</b>. Triangles are not in this ratio."],
 twin:{p:"A bag has 9 red marbles, 5 blue marbles, and 4 green marbles. What is the ratio of red marbles to blue marbles?",f:[["red","9"],["blue","5"]],fmt:"to",ex:"Red first, blue second: 9 to 5. The 4 green marbles are not part of this ratio."}},

{skill:"Reading ratio language",short:"Taco table",
 prompt:'<p>A group of students made tacos for lunch.</p><div class="scroll"><table class="tbl" data-say="Table of tacos. Jackie made 6. Manny made 6. Vinny made 2. Paula made 8. Marta made 4. Evelyn made 2."><tr><th>Student</th><td>Jackie</td><td>Manny</td><td>Vinny</td><td>Paula</td><td>Marta</td><td>Evelyn</td></tr><tr><th>Tacos</th><td>6</td><td>6</td><td>2</td><td>8</td><td>4</td><td>2</td></tr></table></div><p>Which answer choices describe the ratio <b class="mathy">6 : 4</b>? Select all that apply.</p>',
 body:function(){var o=["Jackie's tacos to Marta's tacos","Manny's tacos to Evelyn and Vinny's tacos together","Paula's tacos to Jackie and Manny's tacos together","Marta's tacos to Manny's tacos","Manny's tacos to Marta's tacos","Vinny and Marta's tacos together to Vinny and Evelyn's tacos together"];
  return '<div class="opts">'+o.map(function(t,i){return '<label class="opt"><input type="checkbox" value="'+i+'"><span>'+esc(tx("The ratio of "+t))+'</span></label>'}).join("")+'</div>'},
 check:function(r){var want=[0,1,4,5],got=$$("input:checked",r).map(function(x){return +x.value});if(!got.length)return{empty:1};
  var wrong=got.filter(function(g){return want.indexOf(g)<0}).length,miss=want.filter(function(w){return got.indexOf(w)<0}).length;
  if(!wrong&&!miss)return{ok:1};
  var m=[];if(wrong)m.push(tx("You picked some that don't equal 6 : 4. Check the order and the totals."));if(miss)m.push(tx("There are more that fit. Some choices add two students together first."));
  return{msg:m.join(" ")}},
 hints:["For each choice, find the two numbers it describes. First number first, second number second.","When a choice says 'X and Y together', add those two students' tacos before comparing.","Look at the order too. 4 : 6 is not the same ratio as 6 : 4."],
 how:["Jackie 6 and Marta 4 gives <b>6 : 4</b>. Yes.","Manny 6, Evelyn and Vinny 2 + 2 = 4 gives <b>6 : 4</b>. Yes.","Paula 8, Jackie and Manny 6 + 6 = 12 gives 8 : 12. No.","Marta to Manny is 4 : 6. The order is flipped. No.","Manny to Marta is <b>6 : 4</b>. Yes.","Vinny and Marta 2 + 4 = 6, Vinny and Evelyn 2 + 2 = 4 gives <b>6 : 4</b>. Yes."],
 twin:{p:"Ana made 3 tacos, Ben made 5, Cy made 2, and Di made 1. What is the ratio of Ben's tacos to Cy and Di's tacos together?",f:[["Ben","5"],["Cy + Di","3"]],fmt:":",ex:"Cy and Di made 2 + 1 = 3 tacos together. Ben first: 5 : 3."}},

{skill:"Ratios and equivalent ratios",short:"Pull-ups and sit-ups",
 prompt:'<p>Garson always does 3 pull-ups for every 8 sit-ups. Last night he did 24 sit-ups. Which ratio shows the relationship between the number of <b>pull-ups</b> and the number of <b>sit-ups</b> last night?</p>',
 body:function(){return '<div class="opts">'+["9 : 24","24 : 9","8 : 24","64 : 24"].map(function(t,i){return '<label class="opt"><input type="radio" name="mc" value="'+i+'"><span class="mathy">'+t+'</span></label>'}).join("")+'</div>'},
 check:function(r){var c=$("input:checked",r);if(!c)return{empty:1};var v=+c.value;
  if(v===0)return{ok:1};
  if(v===1)return{msg:tx("The numbers are right but flipped. Pull-ups should come first.")};
  if(v===2)return{msg:tx("8 is the number of sit-ups in the <i>original</i> ratio. Last night he did more. Find how many pull-ups he did with 24 sit-ups.")};
  return{msg:tx("64 comes from 8 × 8. Both numbers in a ratio have to be multiplied by the <b>same</b> number.")}},
 hints:["The original ratio of pull-ups to sit-ups is 3 : 8. Last night's ratio must be equivalent to it.","How many times bigger is 24 than 8?","Multiply both 3 and 8 by that same number."],
 how:["Original ratio, pull-ups to sit-ups: <b>3 : 8</b>.","24 ÷ 8 = 3, so we multiplied sit-ups by 3.","Do the same to pull-ups: 3 × 3 = <b>9</b>.","Last night's ratio is <b>9 : 24</b>."],
 twin:{p:"Mia does 5 push-ups for every 2 laps she runs. She ran 12 laps. How many push-ups did she do?",f:[["push-ups","30"]],fmt:"",ex:"12 ÷ 2 = 6, so multiply 5 by 6. 5 × 6 = 30 push-ups. The ratio is 30 : 12."}},

{skill:"Ratio tables: part-to-part",short:"Recycling cans",
 prompt:'<p>Jordan recycles 7 cans for every 12 cans Ellen recycles. Last week, Jordan recycled 42 cans.</p><p>What number, <i>c</i>, can be multiplied by 12 to find how many cans Ellen recycled? How many cans did Jordan and Ellen recycle <b>in all</b>?</p>',
 body:function(){return '<div class="sentence"><i>c</i> = '+numField("c","c")+'</div><div class="sentence">'+tx("Jordan and Ellen recycled")+' '+numField("t",tx("total cans"))+' '+tx("cans last week.")+'</div>'},
 check:function(r){var c=num($("#c",r).value),t=num($("#t",r).value);if(isNaN(c)||isNaN(t))return{empty:1};
  if(c===6&&t===114)return{ok:1};
  if(c===6&&t===72)return{msg:tx("c = 6 is right. 72 is only Ellen's cans. 'In all' means Jordan <b>plus</b> Ellen.")};
  if(c===6)return{msg:tx("c = 6 is correct. For the total, find Ellen's cans (12 × 6) and add Jordan's 42.")};
  if(c===7)return{msg:tx("7 is Jordan's number in the ratio. Ask: what do you multiply 7 by to get 42? That same number multiplies 12.")};
  return{msg:tx("Think: 7 times what number is 42? That is c.")}},
 hints:["Make a ratio table. Jordan's column: 7 and 42. Ellen's column: 12 and ?","7 times what equals 42? Use the same multiplier on Ellen's side.","After you find Ellen's cans, add Jordan's cans and Ellen's cans together."],
 how:["Jordan 7 ↔ 42 means we multiplied by 42 ÷ 7 = <b>6</b>. So <b>c = 6</b>.","Ellen recycled 12 × 6 = <b>72</b> cans.","In all: 42 + 72 = <b>114</b> cans."],
 twin:{p:"Kai reads 5 pages for every 9 pages Leo reads. Kai read 35 pages. How many pages did Leo read? How many did they read in all?",f:[["Leo","63"],["in all","98"]],fmt:"",ex:"35 ÷ 5 = 7. Leo: 9 × 7 = 63. In all: 35 + 63 = 98."}},

{skill:"Part-to-part with a difference",short:"Track and baseball",
 prompt:'<p>For every 15 students who run track, 7 students play baseball. There are <b>112 more</b> students who run track than play baseball. How many students run track? How many play baseball?</p>',
 body:function(){return '<div class="sentence">'+tx("There are")+' '+numField("a",tx("track"))+' '+tx("students who run track and")+' '+numField("b",tx("baseball"))+' '+tx("students who play baseball.")+'</div>'},
 check:function(r){var a=num($("#a",r).value),b=num($("#b",r).value);if(isNaN(a)||isNaN(b))return{empty:1};
  if(a===210&&b===98)return{ok:1};
  if(a===15&&b===7)return{msg:tx("15 and 7 are the ratio, not the real numbers of students. The real numbers are bigger.")};
  if(a-b===112)return{msg:tx("The difference is 112, but the ratio is off. Check that your numbers are in the ratio 15 : 7.")};
  if(a*7===b*15)return{msg:tx("Your numbers are in the ratio 15 : 7, but they don't differ by 112.")};
  return{msg:tx("Look at how many groups of 15 and 7 you need so the difference is 112. Start with 15 − 7.")}},
 hints:["In one 'group', 15 run track and 7 play baseball. How many <i>more</i> run track in one group?","One group has 8 more track students. You need 112 more. How many groups is that?","Multiply each part of the ratio, 15 and 7, by the number of groups."],
 how:["One group: 15 − 7 = <b>8</b> more students run track.","We need 112 more: 112 ÷ 8 = <b>14</b> groups.","Track: 15 × 14 = <b>210</b>. Baseball: 7 × 14 = <b>98</b>.","Check: 210 − 98 = 112. ✓"],
 twin:{p:"For every 9 students who bike to school, 4 walk. There are 65 more students who bike than walk. How many bike? How many walk?",f:[["bike","117"],["walk","52"]],fmt:"",ex:"9 − 4 = 5 more per group. 65 ÷ 5 = 13 groups. Bike: 9 × 13 = 117. Walk: 4 × 13 = 52."}},

{skill:"Part-to-part and part-to-whole",short:"Airline tickets",
 prompt:'<p>An airline offers the <b>same number of tickets</b> for morning and night flights. The ratio of sold tickets to unsold tickets was <b>3 : 5</b> on morning flights and <b>7 : 1</b> on night flights. The airline sells 581 tickets on night flights. How many unsold tickets can it expect on morning flights?</p>',
 body:function(){return '<div class="sentence">'+tx("The airline can expect")+' '+numField("a",tx("unsold tickets"))+' '+tx("unsold tickets on morning flights.")+'</div>'},
 check:function(r){var a=num($("#a",r).value);if(isNaN(a))return{empty:1};
  if(a===415)return{ok:1};
  if(a===83)return{msg:tx("83 is the number of <i>unsold</i> tickets on <b>night</b> flights. You still need the morning flights.")};
  if(a===664)return{msg:tx("664 is the total number of tickets on one kind of flight. The question asks only for the unsold morning tickets.")};
  if(a===249)return{msg:tx("249 is the number of <i>sold</i> morning tickets (3 × 83). The question asks for unsold.")};
  return{msg:tx("Not yet. Start with night flights. Find how many total tickets that is, since morning has the same total.")}},
 hints:["Night flights: 7 sold for every 1 unsold. If 581 are sold, how many unsold?","Add sold and unsold on night flights to get the total number of tickets. Morning has the same total.","Morning ratio 3 : 5 has 3 + 5 = 8 parts. Split the total into 8 equal parts, then take the unsold ones."],
 how:["Night: 581 ÷ 7 = <b>83</b>, so 83 unsold. Total night tickets: 581 + 83 = <b>664</b>.","Morning has the same total: <b>664</b> tickets.","Morning ratio 3 : 5 has 3 + 5 = 8 parts. One part is 664 ÷ 8 = <b>83</b>.","Unsold is 5 parts: 5 × 83 = <b>415</b>."],
 twin:{p:"On Friday the ratio of sold to unsold tickets is 5 : 1. On Monday it is 2 : 3. Both days have the same total number of tickets. 25 tickets were sold on Friday. How many are unsold on Monday?",f:[["unsold Monday","18"]],fmt:"",ex:"Friday: 25 ÷ 5 = 5 unsold, total 30. Monday has 2 + 3 = 5 parts, 30 ÷ 5 = 6 each. Unsold is 3 × 6 = 18."}},

{skill:"Unit rate and double number lines",short:"Bagels with cream cheese",
 prompt:'<p>A bagel store prepares 4 bagels in 54 seconds and 12 bagels in 162 seconds. At this rate, how many seconds will it take to prepare <b>10 bagels</b>? Fill the blanks in the double number line. Tap a number tile, then tap a blank. Tap a filled blank to take it back.</p>',
 body:function(){var t=[13.5,135,60,160,81,108];
  return '<div class="scroll"><div class="nl" data-say="'+tx("Double number line. Bagels: 0, 1, 4, 10, 12. Seconds: 0, blank, 54, blank, 162.")+'"><div class="lab">'+tx("Bagels")+'</div><div class="cell"><span>0</span></div><div class="cell"><span>1</span></div><div class="cell"><span>4</span></div><div class="cell"><span>10</span></div><div class="cell"><span>12</span></div>'+
  '<div class="lab">'+tx("Seconds")+'</div><div class="cell"><span>0</span></div><div class="cell"><button type="button" class="slot" data-s="0" aria-label="'+tx("seconds for 1 bagel")+'"></button></div><div class="cell"><span>54</span></div><div class="cell"><button type="button" class="slot" data-s="1" aria-label="'+tx("seconds for 10 bagels")+'"></button></div><div class="cell"><span>162</span></div></div></div>'+
  '<div class="tiles" role="group" aria-label="'+tx("Number tiles")+'" data-say="'+tx("Number tiles: 13.5, 135, 60, 160, 81, 108.")+'">'+t.map(function(v){return '<button type="button" class="tile" draggable="true" data-v="'+v+'">'+v+'</button>'}).join("")+'</div>'},
 bind:function(r){var sel=null;function paint(){$$(".tile",r).forEach(function(t){t.classList.toggle("sel",t===sel);t.classList.toggle("used",$$(".slot",r).some(function(s){return s.dataset.v===t.dataset.v}))})}
  function put(s,t){s.textContent=t.dataset.v;s.dataset.v=t.dataset.v;s.classList.add("filled");sel=null;paint()}
  $$(".tile",r).forEach(function(t){t.addEventListener("click",function(){if(t.classList.contains("used"))return;sel=(sel===t?null:t);paint()});t.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",t.dataset.v)})});
  $$(".slot",r).forEach(function(s){s.addEventListener("click",function(){if(s.dataset.v){delete s.dataset.v;s.textContent="";s.classList.remove("filled");paint();return}if(sel)put(s,sel)});
   s.addEventListener("dragover",function(e){e.preventDefault()});
   s.addEventListener("drop",function(e){e.preventDefault();var v=e.dataTransfer.getData("text/plain");var t=$$(".tile",r).filter(function(x){return x.dataset.v===v&&!x.classList.contains("used")})[0];if(t&&!s.dataset.v)put(s,t)})});},
 check:function(r){var s=$$(".slot",r),a=s[0].dataset.v,b=s[1].dataset.v;if(!a||!b)return{empty:1};
  if(a==="13.5"&&b==="135")return{ok:1};
  if(a==="13.5")return{msg:tx("13.5 for one bagel is right. Now use it: 10 bagels takes 10 times as long as 1 bagel.")};
  if(a==="135")return{msg:tx("135 is for 10 bagels, so it goes at the 10. One bagel takes much less time than 54 seconds, since 4 bagels take 54.")};
  return{msg:tx("For 1 bagel, split 54 seconds into 4 equal parts. Then multiply to get 10 bagels.")}},
 hints:["Find the unit rate: how many seconds for 1 bagel? 4 bagels take 54 seconds.","54 ÷ 4 = 13.5 seconds for one bagel. Which tile goes at the 1?","Now 10 bagels take 10 × 13.5 seconds. Which tile is that?"],
 how:["4 bagels take 54 seconds, so 1 bagel takes 54 ÷ 4 = <b>13.5</b> seconds.","Check with 12 bagels: 12 × 13.5 = 162. ✓ The rate is steady.","10 bagels take 10 × 13.5 = <b>135</b> seconds.","Put 13.5 at the 1 and 135 at the 10."],
 twin:{p:"A baker decorates 3 cupcakes in 42 seconds. At this rate, how many seconds for 1 cupcake? How many seconds for 10 cupcakes?",f:[["1 cupcake","14"],["10 cupcakes","140"]],fmt:"",ex:"42 ÷ 3 = 14 seconds each. 10 × 14 = 140 seconds."}},

{skill:"Ratio tables and equations",short:"Turtles and jellyfish",
 prompt:'<p>Alex saw 4 sea turtles and 12 jellyfish. This ratio stayed the same for the rest of his dive.</p><p><b>Part A.</b> Complete the table.</p>',
 body:function(){return '<table class="tbl" data-say="'+tx("Table with two columns, sea turtles and jellyfish. Row 1 has 1 turtle and blank jellyfish. Row 2 has 4 turtles and 12 jellyfish. Row 3 has blank turtles and 24 jellyfish. Row 4 has 14 turtles and blank jellyfish. Row 5 has blank turtles and 60 jellyfish.")+'"><tr><th>'+tx("Sea turtles")+'</th><th>'+tx("Jellyfish")+'</th></tr><tr><td>1</td><td>'+numField("r1",tx("jellyfish"))+'</td></tr><tr><td>4</td><td>12</td></tr><tr><td>'+numField("r2",tx("turtles"))+'</td><td>24</td></tr><tr><td>14</td><td>'+numField("r3",tx("jellyfish"))+'</td></tr><tr><td>'+numField("r4",tx("turtles"))+'</td><td>60</td></tr></table>'+
  '<p style="margin:14px 0 6px">'+tx("<b>Part B.</b> The ratio of <b>jellyfish to sea turtles</b> is")+' '+numField("p1",tx("jellyfish"))+' : '+numField("p2",tx("turtles"))+tx(". The equation that models it (<i>j</i> jellyfish, <i>t</i> turtles) is:")+'</p>'+
  '<div class="opts">'+["j = 3t","t = 3j","j = t ÷ 3","j = 12t"].map(function(t,i){return '<label class="opt"><input type="radio" name="eq" value="'+i+'"><span class="mathy">'+t+'</span></label>'}).join("")+'</div>'},
 check:function(r){var v=["r1","r2","r3","r4","p1","p2"].map(function(i){return num($("#"+i,r).value)}),e=$("input:checked",r);
  if(v.some(isNaN)||!e)return{empty:1};
  var tbl=v[0]===3&&v[1]===8&&v[2]===42&&v[3]===20;
  if(!tbl)return{msg:tx("Check the table. Every row must have the same ratio as 4 : 12. Find how many jellyfish there are for <b>1</b> turtle first, then use it for other rows.")};
  if(!(v[4]===3&&v[5]===1))return{msg:tx("The table is right. For Part B, the question asks jellyfish <b>to</b> turtles. Jellyfish go first.")};
  if(+e.value===1)return{msg:tx("The ratio is right. In t = 3j, the variables are swapped. That would mean turtles are 3 times the jellyfish.")};
  if(+e.value!==0)return{msg:tx("The ratio is right. Test your equation with t = 4. Does it give j = 12?")};
  return{ok:1}},
 hints:["Start with 4 turtles : 12 jellyfish. What is the ratio when there is just 1 turtle?","4 ÷ 4 = 1, so 12 ÷ 4 = 3. Every turtle comes with 3 jellyfish. Use that rate for the rest of the rows.","For the equation, jellyfish = 3 × turtles. Test it with t = 4: does it give 12?"],
 how:["1 turtle: 12 ÷ 4 = <b>3</b> jellyfish.","24 jellyfish: 24 ÷ 3 = <b>8</b> turtles. 14 turtles: 14 × 3 = <b>42</b> jellyfish. 60 jellyfish: 60 ÷ 3 = <b>20</b> turtles.","Jellyfish to turtles: <b>3 : 1</b>.","Jellyfish are always 3 times the turtles: <b>j = 3t</b>."],
 twin:{p:"Zoe sees 3 frogs for every 15 flies. How many flies for 1 frog? How many flies for 7 frogs? How many frogs go with 60 flies?",f:[["flies for 1 frog","5"],["flies for 7 frogs","35"],["frogs for 60 flies","12"]],fmt:"",ex:"15 ÷ 3 = 5 flies per frog. 7 × 5 = 35. 60 ÷ 5 = 12 frogs."}},

{skill:"Ratios on a coordinate plane",short:"Orange paint graph",
 prompt:'<p>To make a darker orange, the class mixes <b>5 ounces of red paint to 3 ounces of yellow paint</b>. Find the yellow paint for each red amount. Then click the grid to plot points A, B, and C. Click a point again to remove it.</p>',
 body:function(){var rows=[["A",5],["B",15],["C",20]];
  var h='<table class="tbl" data-say="'+tx("Table for points A, B, and C. Point A: red 5, yellow blank. Point B: red 15, yellow blank. Point C: red 20, yellow blank.")+'"><tr><th>'+tx("Point")+'</th><th>'+tx("Red")+', <i>x</i></th><th>'+tx("Yellow")+', <i>y</i></th><th>'+tx("Ordered pair")+'</th></tr>'+rows.map(function(x,i){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+numField("y"+i,tx("yellow for")+" "+x[0])+'</td><td class="mathy" id="op'+i+'">( '+x[1]+', ? )</td></tr>'}).join("")+'</table>';
  var U=26,L=44,T=14,B=38,R=14,W=L+24*U+R,H=T+19*U+B,g='';
  for(var i=0;i<=24;i++){var x=L+i*U;g+='<line x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+(T+19*U)+'" stroke="var(--line)" stroke-width="'+(i===0?2:1)+'"/>';g+='<text x="'+x+'" y="'+(T+19*U+16)+'" font-size="11" text-anchor="middle">'+i+'</text>'}
  for(var j=0;j<=19;j++){var y=T+19*U-j*U;g+='<line x1="'+L+'" y1="'+y+'" x2="'+(L+24*U)+'" y2="'+y+'" stroke="var(--line)" stroke-width="'+(j===0?2:1)+'"/>';g+='<text x="'+(L-8)+'" y="'+(y+4)+'" font-size="11" text-anchor="end">'+j+'</text>'}
  g+='<text x="'+(L+12*U)+'" y="'+(H-4)+'" font-size="13" text-anchor="middle" style="font-weight:700">'+tx("Ounces of red paint")+'</text>';
  g+='<text transform="translate(12 '+(T+9*U)+') rotate(-90)" font-size="13" text-anchor="middle" style="font-weight:700">'+tx("Ounces of yellow paint")+'</text><g id="pts"></g>';
  return h+'<svg class="graph" id="gr" data-say="'+tx("A coordinate grid. Red paint is on the horizontal axis and yellow paint is on the vertical axis.")+'" viewBox="0 0 '+W+' '+H+'" data-u="'+U+'" data-l="'+L+'" data-t="'+T+'" role="img" aria-label="'+tx("Coordinate grid, red paint on the horizontal axis from 0 to 24, yellow paint on the vertical axis from 0 to 19. Click to plot points.")+'">'+g+'</svg><div class="sub" id="plist" aria-live="polite">'+tx("No points plotted yet.")+'</div>'},
 bind:function(r){var svg=$("#gr",r),pts=[],U=+svg.dataset.u,L=+svg.dataset.l,T=+svg.dataset.t;
  [0,1,2].forEach(function(i){$("#y"+i,r).addEventListener("input",function(){var v=$("#y"+i,r).value.trim();$("#op"+i,r).textContent="( "+[5,15,20][i]+", "+(v===""?"?":v)+" )"})});
  function draw(){var g=$("#pts",svg);g.innerHTML=pts.map(function(p){var cx=L+p[0]*U,cy=T+19*U-p[1]*U;return '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="var(--warm)" stroke="var(--ink)" stroke-width="2"/><text x="'+(cx+10)+'" y="'+(cy-9)+'" font-size="12" style="fill:var(--ink);font-weight:700">('+p[0]+', '+p[1]+')</text>'}).join("");
   $("#plist",r).textContent=pts.length?tx("Plotted:")+" "+pts.map(function(p){return "("+p[0]+", "+p[1]+")"}).join("  "):tx("No points plotted yet.")}
  svg.addEventListener("click",function(e){var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var m=pt.matrixTransform(svg.getScreenCTM().inverse());
   var x=Math.round((m.x-L)/U),y=Math.round((T+19*U-m.y)/U);if(x<0||x>24||y<0||y>19)return;
   var k=pts.findIndex(function(p){return p[0]===x&&p[1]===y});if(k>=0)pts.splice(k,1);else if(pts.length<3)pts.push([x,y]);else{$("#plist",r).textContent=tx("You already have 3 points. Click one to remove it first.");return}draw()});
  r._pts=pts},
 check:function(r){var ys=[0,1,2].map(function(i){return num($("#y"+i,r).value)});if(ys.some(isNaN))return{empty:1};
  if(!(ys[0]===3&&ys[1]===9&&ys[2]===12))return{msg:tx("Check the yellow amounts. For every 5 red there are 3 yellow. How many groups of 5 are in 15? In 20?")};
  var p=r._pts;if(p.length<3)return{msg:tx("Your table is right. Now plot all three points: (red, yellow).")};
  var need=["5,3","15,9","20,12"],got=p.map(function(a){return a.join(",")});
  if(need.every(function(n){return got.indexOf(n)>=0}))return{ok:1};
  return{msg:tx("Check your points. Each point is (red, yellow). Go <b>right</b> by the red amount first, then <b>up</b> by the yellow amount.")}},
 hints:["For A: 5 red goes with 3 yellow. For B: 15 is 5 × 3. What do you do to the 3?","B: 3 × 3 = 9. For C: 20 is 5 × 4, so multiply 3 by 4.","To plot (5, 3), start at 0, go right 5, then up 3. Plot all three points."],
 how:["A: (5, 3). That is the ratio itself.","B: 15 ÷ 5 = 3, so 3 × 3 = 9. Point <b>(15, 9)</b>.","C: 20 ÷ 5 = 4, so 3 × 4 = 12. Point <b>(20, 12)</b>.","Plot each: right for red (x), then up for yellow (y). The three points line up in a straight line through (0, 0)."],
 twin:{p:"The ratio of blue paint to white paint is 4 : 3. How many ounces of white paint go with 8, 12, and 20 ounces of blue?",f:[["with 8","6"],["with 12","9"],["with 20","15"]],fmt:"",ex:"8 = 4 × 2, so 3 × 2 = 6. 12 = 4 × 3, so 9. 20 = 4 × 5, so 15."}},

{skill:"Equations from ratios",short:"Fishing trip",
 prompt:'<p>James went fishing. The ratio of the number of casts, <i>P</i>, to the number of fish he caught, <i>F</i>, was <b>8 : 1</b>. Select <b>all</b> the true statements. A ratio table can help.</p>',
 body:function(){var o=["The equation P = ⅛F can be used to find the number of casts, given the number of fish caught.","If James caught 32 fish, then he cast his pole 4 times.","If James cast his pole 64 times, then he caught 8 fish.","The equation F = ⅛P can be used to find the number of fish caught, given the number of casts.","The equation F = 8P can be used to find the number of fish caught, given the number of casts."];
  return '<div class="opts">'+o.map(function(t,i){return '<label class="opt"><input type="checkbox" value="'+i+'"><span>'+esc(tx(t))+'</span></label>'}).join("")+'</div>'},
 check:function(r){var want=[2,3],got=$$("input:checked",r).map(function(x){return +x.value});if(!got.length)return{empty:1};
  var wrong=got.filter(function(g){return want.indexOf(g)<0}),miss=want.filter(function(w){return got.indexOf(w)<0});
  if(!wrong.length&&!miss.length)return{ok:1};
  var m=[];if(wrong.length)m.push(tx("At least one you picked is false. Test each number statement with the 8 : 1 ratio, and check which variable the equation solves for."));if(miss.length)m.push(tx("You are missing at least one true statement."));
  return{msg:m.join(" ")}},
 hints:["Make a ratio table. Casts P : fish F. 8 casts go with 1 fish, 16 casts with 2 fish, and so on.","Casts are always bigger than fish. Which number should be the big one in a number statement?","For an equation, ask: to get F from P, do I divide by 8 or multiply by 8? Dividing by 8 is the same as multiplying by ⅛."],
 how:["Ratio 8 : 1 means <b>P = 8F</b> (casts are 8 times the fish) and <b>F = P ÷ 8 = ⅛P</b>.","Statement 1: P = ⅛F would make casts <i>smaller</i> than fish. False.","Statement 2: 32 fish means 32 × 8 = 256 casts, not 4. False.","Statement 3: 64 casts ÷ 8 = <b>8 fish</b>. True.","Statement 4: F = ⅛P. True.","Statement 5: F = 8P would mean 8 fish per cast. False."],
 twin:{p:"The ratio of casts to fish was 6 : 1. If James caught 7 fish, how many casts? If he cast 54 times, how many fish did he catch?",f:[["casts for 7 fish","42"],["fish for 54 casts","9"]],fmt:"",ex:"Casts = 6 × fish: 6 × 7 = 42. Fish = casts ÷ 6: 54 ÷ 6 = 9."}}
];
